track: ruler

# Official NVIDIA RULER synthetic.yaml task names (+ legacy aliases).
all_tasks: [
    "niah_single_1",
    "niah_single_2",
    "niah_single_3",
    "niah_multikey_1",
    "niah_multikey_2",
    "niah_multikey_3",
    "niah_multivalue",
    "niah_multiquery",
    "vt",
    "cwe",
    "fwe",
    "qa_1",
    "qa_2",
]

alias_tasks: ["niah", "mq_niah"]
depth_tasks: [
  niah_single_1,
  niah_single_2,
  niah_single_3,
  niah_multikey_1,
  niah_multikey_2,
  niah_multikey_3,
  niah_multivalue,
  niah_multiquery,
  vt,
  qa_1,
  qa_2,
  niah,
  mq_niah,
]

pad_id: 0
cls_id: 1
eos_id: 2
unk_id: 3
num_special: 4

task_info:
  niah: 
    num_labels: 10
    pair: False
  
  mq_niah:
    num_labels: 10
    pair: False

compute:
  ruler-smoke:
    train_samples: 256
    eval_samples: 128
    batch_size: 8
    grad_accum: 1
    epochs: 2
    desc: Quick pipeline sanity check

  ruler-oom:
    train_samples: 32
    eval_samples: 16
    batch_size: 1
    grad_accum: 1
    epochs: 1
    desc: Tiny budget for OOM/survival probes at long context

  ruler-report:
    train_samples: 1000
    eval_samples: 200
    batch_size: 4
    grad_accum: 2
    epochs: 4
    desc: Moderate budget for depth × context retention sweeps

  ruler-full:
    train_samples: 5000
    eval_samples: 500
    batch_size: 8
    grad_accum: 2
    epochs: 8
    desc: Full synthetic training budget

default_seq_len: 4096

default_seq_options: [2048, 4096, 8192]
default_depth: 0.5

default_seqs:
  niah: [2048, 4096, 8192]
  mq_niah: [2048, 4096, 8192]

default_depths: [0.1, 0.5, 0.9]