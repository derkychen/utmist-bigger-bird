# RULER compute presets and default sweep axes (full 13-task suite)

track: ruler

pad_id: 0
cls_id: 1
eos_id: 2
unk_id: 3
num_special: 4

niah_labels: 10
word_vocab: 10

task_info:
  # Official RULER names
  niah_single_1:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_single_2:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_single_3:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_multikey_1:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_multikey_2:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_multikey_3:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_multivalue:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  niah_multiquery:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  vt:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  cwe:
    num_labels: ${word_vocab}
    pair: false
    uses_depth: false

  fwe:
    num_labels: ${word_vocab}
    pair: false
    uses_depth: false

  qa_1:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  qa_2:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  # Aliases / legacy
  niah:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

  mq_niah:
    num_labels: ${niah_labels}
    pair: false
    uses_depth: true

official_tasks: [
    "niah_single_1",
    "niah_single_2",
    "niah_single_3",
    "niah_multikey_1",
    "niah_multikey_2",
    "niah_multikey_3",
    "niah_multivalue",
    "niah_multiquery",
    "vt",
    "cwe",
    "fwe",
    "qa_1",
    "qa_2",
]

compute:
  ruler-smoke:
    train_samples: 256
    eval_samples: 128
    batch_size: 8
    grad_accum: 1
    epochs: 2
    desc: "Quick pipeline sanity check"

  ruler-oom:
    train_samples: 32
    eval_samples: 16
    batch_size: 1
    grad_accum: 1
    epochs: 1
    desc: "Tiny budget for OOM/survival probes at long context"

  ruler-report:
    train_samples: 1000
    eval_samples: 200
    batch_size: 4
    grad_accum: 2
    epochs: 4
    desc: "Moderate budget for depth × context retention sweeps"

  ruler-full:
    train_samples: 5000
    eval_samples: 500
    batch_size: 8
    grad_accum: 2
    epochs: 8
    desc: "Full synthetic training budget"


# Official NVIDIA RULER synthetic.yaml task names (+ legacy aliases)
all_tasks: [
  niah_single_1,
  niah_single_2,
  niah_single_3,
  niah_multikey_1,
  niah_multikey_2,
  niah_multikey_3,
  niah_multivalue,
  niah_multiquery,
  vt,
  cwe,
  fwe,
  qa_1,
  qa_2,
]

alias_tasks: [niah, mq_niah]

depth_tasks: [
  niah_single_1,
  niah_single_2,
  niah_single_3,
  niah_multikey_1,
  niah_multikey_2,
  niah_multikey_3,
  niah_multivalue,
  niah_multiquery,
  vt,
  qa_1,
  qa_2,
  niah,
  mq_niah,
]


default:
  seq_len: 4096
  depth: 0.5
  seqs: [2048, 4096, 8192]
  depths: [0.1, 0.5, 0.9]