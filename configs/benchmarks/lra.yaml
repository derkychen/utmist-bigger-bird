track: lra

all_tasks: ["listops", "text", "retrieval", "image", "pathfinder", "pathfinder_x"]

pad_id: 0
cls_id: 1
eos_id: 2
unk_id: 3
num_special: 4

task_info:
  listops: 
    num_labels: 10
    pair: False

  text:
    num_labels: 2
    pair: False
  
  retrieval: 
    num_labels: 2
    pair: True

compute:
  lra-smoke:
    train_samples: 256
    eval_samples: 128
    batch_size: 8
    grad_accum: 1
    epochs: 2
    desc: Quick pipeline sanity check (small data, few steps)

  lra-oom:
    train_samples: 32
    eval_samples: 16
    batch_size: 1
    grad_accum: 1
    epochs: 1
    desc: Tiny budget to probe OOM/survival at large context windows (fast per run)

  lra-report:
    train_samples: 2000
    eval_samples: 400
    batch_size: 16
    grad_accum: 1
    epochs: 10
    desc: Moderate run for the context-window report (fits a 6GB GPU)

  lra-full:
    train_samples: 8000
    eval_samples: 1000
    batch_size: 8
    grad_accum: 2
    epochs: 8
    desc: LRA-scale from-scratch training

default_seq:
  listops: 2048
  text: 4096
  retrieval: 4096
  image: 1025          # 32x32 pixels + [CLS]
  pathfinder: 1025     # 32x32 + [CLS]
  pathfinder_x: 16385  # 128x128 + [CLS]

default_seqs:
  listops: [512, 1024, 2048]
  text: [1024, 2048, 4096]
  retrieval: [1024, 2048, 4096]
  image: [257, 1025]           # 16x16 and 32x32
  pathfinder: [257, 1025]
  pathfinder_x: [4097, 16385]  # 64x64 smoke / full 128x128