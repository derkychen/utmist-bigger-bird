<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bigger Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fg:#111418; --muted:#6b7280; --accent:#1f4fd8; --good:#1a7f37; --bad:#cf222e;
          --g:#a8d5a2; --b:#a9c4f5; --o:#f7c48f; --p:#b9a6dc; --r:#e06666; --y:#fde49c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#eceef1; color:var(--fg);
               font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .slide { display:none; position:absolute; top:1vh; left:50%; transform:translateX(-50%);
           width:min(96vw, 160vh); height:min(54vw, 90vh);
           background:#fff; padding:5% 8%; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden;
           flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .slide.active { display:flex; }
  .say { font-size:3.3vw; font-weight:700; line-height:1.25; letter-spacing:-.015em; margin:0; max-width:90%; text-wrap:balance; }
  .sub { font-size:1.6vw; color:var(--muted); margin:.9em 0 0; max-width:85%; line-height:1.4; }
  .slide img { max-width:100%; max-height:62vh; object-fit:contain; }
  .k-img .say { font-size:2.4vw; margin-top:.6em; }
  .k-photo img { border-radius:12px; max-height:64vh; }
  .k-section .say { font-size:4.4vw; font-weight:800; color:var(--accent); }
  .secnum { display:block; font-size:1.3vw; font-weight:700; color:#9aa3b2; letter-spacing:.28em; margin-bottom:1em; }
  .num { font-size:9vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .corner { position:absolute; top:4%; right:4%; height:7%; max-height:none !important; }
  .footer { position:absolute; bottom:2.5%; left:calc(4% + 4vw); font-size:.9vw; color:var(--muted); }
  .timer { position:absolute; bottom:2.5%; left:4%; font-size:.9vw; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pvw { position:absolute; bottom:1vh; right:2%; height:6.5vh; aspect-ratio:16/9; overflow:hidden;
         border:1px solid #e3e6ee; border-radius:6px; background:#fff; opacity:.95;
         box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .pvw .in { position:relative; width:100vw; height:100vh; transform-origin:top left; pointer-events:none; }
  .pvw .in .slide { display:flex; }

  /* Title */
  .k-hero .row { display:flex; align-items:center; gap:3.5vw; position:absolute; top:30%; left:50%; transform:translateX(-50%); }
  .k-hero .row img { max-height:23vh; }
  .k-hero .big { font-size:5.5vw; font-weight:800; letter-spacing:-.02em; line-height:1.1; text-align:left; white-space:nowrap; }
  .k-hero .small { font-size:2.1vw; font-weight:500; color:var(--muted); margin-top:.5em; text-align:left; }
  .k-hero .say { position:absolute; top:68%; left:8%; right:8%; margin:0; }

  /* Stage: visual stays fixed in the middle, the sentence changes at the bottom */
  .stage .vis { position:absolute; top:7%; bottom:27%; left:6%; right:6%;
                display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage .vis > img { max-height:100%; max-width:100%; }
  .stage .cap { position:absolute; top:76%; left:7%; right:7%; display:flex; flex-direction:column; align-items:center; }
  .stage .cap .say { font-size:2.6vw; max-width:100%; }
  .stage .cap .sub { font-size:1.4vw; margin-top:.5em; }

  /* Tokens */
  .toks { display:flex; gap:.6vw; flex-wrap:wrap; justify-content:center; }
  .tok { font-size:2.4vw; font-weight:600; padding:.35em .6em; border-radius:.4em; border:2px solid #d8dde3; background:#fff; }
  .tok.back { background:#e8efff; border-color:var(--b); }
  .tok.cur { background:var(--accent); border-color:var(--accent); color:#fff; }
  .toknote { font-size:1.4vw; color:var(--muted); margin-top:1.2em; }

  /* Attention formula */
  .formula { font-family: "Times New Roman", Georgia, serif; font-size:3.2vw; margin-bottom:.9em; }
  .formula .qc { color:#b8860b; font-style:italic; } .formula .kc { color:#0f8f8f; font-style:italic; }
  .vecs { display:flex; gap:3vw; }
  .vec { border:3px solid; border-radius:10px; padding:.5em .9em; font-family:"Times New Roman", Georgia, serif;
         font-style:italic; font-size:2.3vw; word-spacing:.45em; }
  .vec.vq { border-color:#e0b400; color:#b8860b; } .vec.vk { border-color:#2bb3b3; color:#0f8f8f; }
  .vec sub { font-size:.6em; letter-spacing:0; }

  /* Growth animation */
  .quadcv { height:100%; max-height:44vh; aspect-ratio: 660 / 480; }
  .quadlab { font-size:1.9vw; font-weight:600; color:var(--muted); margin-top:.3em; }
  .quadlab b { color:var(--accent); font-weight:800; }

  /* Model chips */
  .chips { display:flex; flex-wrap:wrap; gap:1vw; justify-content:center; max-width:80%; }
  .chip { font-size:2vw; font-weight:700; padding:.45em .9em; border-radius:999px; background:#f2f4f7; }
  .chip.hl { background:var(--accent); color:#fff; }

  /* Big Bird grids */
  .bbrow { display:flex; align-items:center; gap:1.6vw; }
  .bbp { display:flex; flex-direction:column; align-items:center; transition:opacity .2s; }
  .bbp.off, .op.off { opacity:.12; }
  .grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:2px; width:15vw; }
  .grid i { aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .grid i.g { background:var(--g); border-color:#86c07f; } .grid i.b { background:var(--b); border-color:#7fa6ee; }
  .grid i.o { background:var(--o); border-color:#eba25c; }
  .bbp b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.7em; }
  .op { font-size:3vw; font-weight:800; color:#7fa6ee; }
  .grid.kg { grid-template-columns:repeat(20, 1fr); width:min(23vw, 40vh); }
  .grid.kg i { border-width:1px; }
  .grid i.d { background:var(--accent); border-color:var(--accent); } .grid i.p { background:var(--p); border-color:#9a83c8; }
  .grid i.t { background:#f7c9c9; border-color:#eda9a9; }
  .grid.kg i:not([class=""]) { animation:kfill .04s linear both; animation-delay:calc(var(--d) * 2ms); }
  @keyframes kfill { from { background:#fff; border-color:#c9ced6; } }
  /* Masking: a soft red band sweeps over every cell, kept or not */
  .grid i.m { background:#e3e6ec; border-color:#cfd3da; }
  .grid.kg.scan i:not([class=""]) { animation:none; position:relative; }
  .grid.kg.scan i::after { content:""; position:absolute; inset:-1px; border-radius:2px; background:var(--r); opacity:0;
                           animation:kscan 9s linear infinite; animation-delay:calc(var(--d) * 18ms); }
  @keyframes kscan { 0% { opacity:.6; } 10%, 100% { opacity:0; } }

  /* Gather: the same keys copied once per token */
  .gw { display:flex; flex-direction:column; gap:.45vw; align-items:flex-start; }
  .grow { display:flex; align-items:center; gap:1vw; }
  .glab { width:15vw; text-align:right; font-family:ui-monospace, Menlo, monospace; font-size:1.15vw; color:#3a3f4a; }
  .gw .strip i { width:1.7vw; }
  .gmore { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .3s + .2s); }
  .gcopy .glab { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .4s + .7s); }
  .gcopy .strip i { position:relative; z-index:1; animation:gfly .45s ease-in-out both;
                    animation-delay:calc(var(--n) * .4s + var(--i) * .07s + .4s); }
  @keyframes gfly { from { transform:translate(calc(var(--sx) * (1.7vw + 3px)), calc(var(--sy) * -2.15vw)); } }
  @keyframes gpop { from { opacity:0; transform:translateY(-1vw); } }
  .gmore { font-size:1.2vw; font-weight:600; color:var(--muted); margin:.1vw 0 .6vw 16vw; }
  .gbar { height:1.5vw; border-radius:.25vw; transform-origin:left; animation:gbar .6s ease-out both; animation-delay:calc(var(--n) * .3s + .2s); }
  @keyframes gbar { from { transform:scaleX(0); } }
  /* One softmax: a token's keys leave the document row and line up in one box */
  .smsrc { margin-bottom:6.5vw; position:relative; }
  .smarrow { position:absolute; bottom:calc(100% + .5vw); left:calc(var(--c) * (3vw + 3px) + 1.5vw); transform:translateX(-50%);
             display:flex; flex-direction:column; align-items:center; color:var(--r); font-size:1.4vw; font-weight:700; white-space:nowrap; line-height:1.15; }
  .smarrow b { font-size:2.2vw; line-height:1; }
  .strip.smsrc i, .smbox .strip i { width:3vw; }
  .smbox { display:flex; flex-direction:column; align-items:center; padding:1.5vw 1.7vw .9vw; border:3px solid #3a3f4a; border-radius:.8vw;
           animation:smon .4s ease both; animation-delay:2.1s; }
  @keyframes smon { from { border-color:#dfe3ea; } }
  .smbox .strip i { position:relative; z-index:1; animation:smfly .5s ease-in-out both; animation-delay:calc(var(--i) * .15s + .4s); }
  @keyframes smfly { from { transform:translate(calc(var(--sx) * (3vw + 3px) - 12vw), calc(-11vw - 3px)); } }
  .smwrap { display:flex; align-items:stretch; gap:3vw; }
  .smscore { width:21vw; display:flex; flex-direction:column; justify-content:center; gap:.35vw;
             text-align:left; white-space:nowrap; font-size:2vw; }
  .smscore div { display:flex; align-items:center; gap:.5vw; }
  .smscore i { width:1.9vw; height:1.9vw; border-radius:3px; display:inline-block; }
  .smscore b { font-weight:800; min-width:3vw; }
  .smbox .strip i { display:flex; align-items:center; justify-content:center; }
  .smx { display:block; font-style:normal; font-size:1.55vw; font-weight:800; color:#3a3f4a; animation:smpop .3s cubic-bezier(.3, 1.6, .6, 1) both; animation-delay:calc(var(--i) * .07s + 2.5s); }
  .smx.hi { color:#4b2e96; }
  @keyframes smpop { from { opacity:0; transform:scale(0); } }
  .smlab { font-family:ui-monospace, Menlo, monospace; font-size:1.7vw; font-weight:700; margin-top:.7vw; animation:gpop .3s ease-out both; animation-delay:2.1s; }
  /* Tiling: the read cells of each 4-row band move into their program's slot at the same time */
  .tgw2 { display:flex; flex-direction:column; align-items:center; }
  .grid.tg2 { gap:.08vw; width:auto; }
  .grid.tg2.tgsrc { grid-template-columns:repeat(19, .92vw); }
  .grid.tg2 { grid-template-columns:repeat(9, .92vw); }
  .grid.tg2 i { width:.92vw; border-width:1px; border-radius:1px; }
  .tgsrc i:not([class=""]) { animation:tgfade .8s ease-in-out both; animation-delay:.7s; }
  @keyframes tgfade { to { opacity:.3; } }
  .tgslots { display:flex; gap:2vw; margin-top:2.2vw; }
  .tgslot { padding:.6vw; border:2px solid #3a3f4a; border-radius:.6vw; display:flex; flex-direction:column; align-items:center; }
  .tgslot .grid.tg2 i[class=""] { border-color:transparent; background:transparent; }
  .tgslot .grid.tg2 i:not([class=""]) { position:relative; z-index:1; animation:tgmove .8s ease-in-out both; animation-delay:.7s; }
  @keyframes tgmove { from { transform:translate(calc(var(--dc) * 1vw + (1.5 - var(--k)) * (12.12vw + 4px)), calc(var(--dr) * 1vw - 18.72vw - 2px)); } }
  .tglab2 { font-family:ui-monospace, Menlo, monospace; font-size:1.25vw; font-weight:700; margin-top:.5vw; }
  /* Online softmax: batches fly into the running values and vanish; the values update each time */
  .os { display:flex; flex-direction:column; align-items:center; }
  .osbatches { display:flex; gap:2.2vw; margin-bottom:3.5vw; }
  .osb { display:flex; flex-direction:column; align-items:center; font-family:ui-monospace, Menlo, monospace; font-size:1.2vw; color:#3a3f4a; }
  .osb div { display:flex; gap:.4vw; margin-top:.4vw; }
  .osl { animation:osoff .25s calc(var(--t) + .25s) forwards; }
  .osk { width:3.2vw; height:3.2vw; border-radius:.3vw; display:flex; align-items:center; justify-content:center; font:800 1.6vw Inter, sans-serif; font-style:normal; color:#3a3f4a;
         animation:osfly .5s ease-in both; animation-delay:var(--t); }
  @keyframes osfly { to { transform:translate(var(--x), 7vw) scale(.35); opacity:0; } }
  .osbox { display:flex; gap:2.5vw; padding:1vw 2vw; border:3px solid #3a3f4a; border-radius:.8vw; }
  .osf { display:flex; flex-direction:column; align-items:center; }
  .osf > span { font-size:1.15vw; font-weight:600; color:var(--muted); margin-bottom:.35vw; white-space:nowrap; }
  .osv { display:grid; justify-items:center; align-items:center; min-height:2.6vw; font-size:1.9vw; font-weight:800; font-variant-numeric:tabular-nums; }
  .osv > b { grid-area:1 / 1; font-weight:800; white-space:nowrap; }
  .osv .off { color:#c9ced6; animation:osoff .15s var(--to) forwards; }
  .osv .mid { animation:oson .2s var(--on) both, osoff .15s var(--to) forwards; }
  .osv .last { animation:oson .2s var(--on) both; }
  @keyframes oson { from { opacity:0; } }
  @keyframes osoff { to { opacity:0; } }
  .osv.wide { width:32vw; display:block; }
  .osbar { display:flex; height:2.6vw; width:100%; }
  .osbar i { flex:none; display:grid; align-items:center; justify-items:center; font:700 1.05vw Inter, sans-serif; font-style:normal; color:#3a3f4a; overflow:hidden; box-shadow:inset -2px 0 #fff; }
  .osbar i b { grid-area:1 / 1; font-weight:700; }
  .osout { margin-top:1.1vw; font-size:1.5vw; font-weight:700; color:var(--accent); animation:gpop .35s ease-out both; animation-delay:6.3s; }
  /* In place: tokens hold position numbers only; K's own cells light up as they get read */
  .gw .strip.gread i.p { animation:gring .4s ease-out 5; animation-delay:.55s; }
  @keyframes gring { 0% { box-shadow:0 0 0 .25vw var(--accent); transform:scale(1.15); } 100% { box-shadow:0 0 0 0 var(--accent); transform:scale(1); } }
  .gchip { display:flex; align-items:center; justify-content:center; width:2.6vw; height:1.7vw; border:1.5px dashed #9a83c8; border-radius:2px;
           font:700 1.05vw ui-monospace, Menlo, monospace; color:#4b2e96; }
  .gchips { display:flex; gap:3px; }
  .gpos { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .4s + .4s); }
  /* Exact tail: settings change, then the nearby window stretches left over the whole document */
  .xtrow { display:flex; flex-direction:column; align-items:center; margin-top:3.4vw; }
  .strip.smsrc.xt { margin-bottom:.7vw; }
  .xtset { font-size:1.4vw; color:var(--muted); } .xtset b { color:var(--fg); font-weight:800; }
  .gval { font-size:1.25vw; font-weight:800; animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .3s + .5s); }
  .kgw { position:relative; }
  .kax { font-family: ui-monospace, Menlo, monospace; font-size:1.2vw; color:#3a3f4a; white-space:nowrap; display:flex; align-items:center; }
  .kax svg { display:block; overflow:visible; fill:none; stroke:#8a93a3; stroke-width:2; }
  .kax svg path { vector-effect:non-scaling-stroke; }
  .kax.top { flex-direction:column; margin-bottom:.4vw; }
  .kax.top svg { width:100%; height:.9vw; margin-top:.25vw; }
  .kax.left { position:absolute; right:100%; top:0; bottom:0; margin-right:.5vw; }
  .kax.left svg { width:.9vw; height:100%; margin-left:.5vw; }

  /* Window strips */
  .strip { display:flex; gap:3px; }
  .strip i { width:2.4vw; aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .strip i.y { background:var(--y); border-color:#efc95a; } .strip i.p { background:var(--p); border-color:#9a83c8; }
  .strip i.r { background:var(--r); border-color:#c94a4a; } .strip i.g { background:var(--g); border-color:#86c07f; }
  .strip i.b { background:var(--b); border-color:#7fa6ee; } .strip i.q { background:#3a3f4a; border-color:#3a3f4a; }
  .strip i.cur { outline:3px solid var(--r); outline-offset:1px; }
  .wrow { display:flex; flex-direction:column; align-items:center; margin:.9em 0; transition:opacity .2s; }
  .wrow.off { opacity:.3; }
  .wrow b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.5em; }
  .legend { display:flex; gap:2vw; margin-top:1.6em; }
  .legend span { font-size:1.35vw; display:flex; align-items:center; gap:.5em; transition:opacity .2s; }
  .legend span.off { opacity:.15; }
  .legend i { width:1.4vw; height:1.4vw; border-radius:3px; display:inline-block; }

  .strip i.e { border-color:#3a3f4a; border-width:2.5px; } .strip i.all { background:#e3e6ec; border-color:#cfd3da; }

  /* Routing scan: how the end picks spots */
  .rtrow { display:flex; gap:3px; align-items:flex-end; }
  .rtcol { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:9.5vw; gap:5px; }
  .rtcol .bar { width:1.1vw; border-radius:2px 2px 0 0; background:#c9ced6; transition:opacity .25s; }
  .rtcol .bar.win { background:var(--p); }
  .rtcol .bar.off2 { opacity:0; }
  .rtcol .cell { width:2.4vw; height:2.4vw; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; transition:background .25s; }
  .rtcol .cell.e { border-color:#3a3f4a; border-width:2.5px; }
  .rtcol .cell.p { background:var(--p); border-color:#9a83c8; }
  .rtcol .cell.r { background:var(--r); border-color:#c94a4a; }
  .rtcol .cell.cur { outline:3px solid var(--r); outline-offset:1px; }

  /* Fixed window vs document length */
  .scwrap { display:flex; flex-direction:column; gap:1.5vw; width:96%; }
  .scrow { display:flex; align-items:center; gap:1.2vw; transition:opacity .25s; }
  .scrow.off { opacity:.12; }
  .sclab { width:7.5vw; text-align:right; font-size:1.25vw; font-weight:600; color:var(--muted); }
  .scbar { height:1.9vw; background:#eef0f3; border-radius:.45vw; position:relative; }
  .scwin { position:absolute; right:0; top:0; bottom:0; width:1.28vw; background:var(--b); border-radius:0 .45vw .45vw 0;
           font-style:normal; font-size:.85vw; font-weight:800; color:#fff; display:flex; align-items:center; justify-content:center; }
  .scnote { font-family:ui-monospace, Menlo, monospace; font-size:1.15vw; color:var(--muted); margin-top:.6vw; }

  /* Quadratic vs linear growth chart */
  .expl svg { width:min(82vw, 1000px); }
  .expl .cur { transition:opacity .25s; } .expl .cur.off { opacity:.15; }

  /* Struggle wall */
  .wall { display:grid; grid-template-columns:repeat(5, 1fr); gap:.7vw; width:100%; }
  .wt { border:2px solid #e1e4ea; border-radius:.8vw; padding:.55em .5em; text-align:left; background:#fff; transition:opacity .25s, background .25s, border-color .25s; }
  .wt b { display:block; font-size:.95vw; color:var(--muted); font-weight:700; }
  .wt span { display:block; font-size:1.15vw; font-weight:600; line-height:1.25; margin-top:.15em; }
  .wt.dim { opacity:.3; }
  .wt.hi { background:#eef3ff; border-color:var(--accent); } .wt.hi b { color:var(--accent); }
  .wt.last { background:var(--accent); border-color:var(--accent); color:#fff; } .wt.last b { color:#cfdcff; }

  /* Stats */
  .stats { display:flex; gap:3.5vw; justify-content:center; }
  .stat { text-align:center; transition:opacity .25s; }
  .stat.off { opacity:.12; }
  .stat .sn { font-size:7vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .stat .sl { font-size:1.4vw; color:var(--muted); font-weight:600; margin-top:.4em; max-width:14vw; }

  /* Scoreboard */
  .board { border-collapse:collapse; font-size:1.55vw; }
  .board th { font-size:1.1vw; color:var(--muted); font-weight:600; text-align:left; padding:.4em 1.2em; }
  .board td { padding:.55em 1.2em; border-top:1px solid #eef0f3; text-align:left; font-weight:600; }
  .board td.n { text-align:center; font-weight:800; }
  .board .bad { color:var(--bad); } .board .good { color:var(--good); }
  .board small { font-weight:500; color:var(--muted); font-size:.75em; }
  .board tr.off { opacity:.12; }

  /* Test examples */
  .exbox .prompt { font-size:1.25vw; max-width:100%; }
  .exbox.big .extag { font-size:1.6vw; } .exbox.big .exrule { font-size:1.25vw; margin-bottom:1.3em; }
  .exbox.big .prompt { font-size:1.85vw; padding:1.3em 1.5em; }
  .exgrid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1.4vw 1.6vw; width:97%; }
  .exgrid .extag { font-size:1vw; margin-bottom:.15em; }
  .exgrid .exrule { font-size:.75vw; margin-bottom:.6em; }

    const BATCH = [[1, 2], [0, 3], [5, 1], [2, 4]], COL = ["g", "b", "p", "o"], T = b => .4 + b * 1.7, LAND = .5;
    // Real online softmax over the example scores; every number on the slide comes from here.
    let max = -Infinity, denom = 0, acc = [];
    const states = BATCH.map((scores, b) => {
      const nm = Math.max(max, ...scores), a = Math.exp(max - nm) || 0;
      denom *= a; acc = acc.map(w => [w[0] * a, w[1]]);
      scores.forEach(s => { const p = Math.exp(s - nm); denom += p; acc.push([p, COL[b]]); });
      max = nm;
      return {max, denom, bar: acc.map(w => [w[0] / denom, w[1]])};
    });
    const stack = (vals, cls) => `<div class="osv ${cls}"><b style="--on:0s;--to:${T(0) + LAND}s" class="off">${cls ? "" : "–"}</b>` + vals.map((v, k) =>

    // One bar: each key's segment eases to its new share, so older segments slide left as new ones enter from the right.
    const END = T(BATCH.length) + 1, SLIDE = .6, last = states[states.length - 1].bar, pct = s => (s / END * 100).toFixed(2);
    const frames = last.map((_, j) => {
      let w = 0, kf = "0% { width:0%; } ";
      states.forEach((s, k) => {
        const on = T(k) + LAND, nw = (s.bar[j] ? s.bar[j][0] : 0) * 100;
        kf += `${pct(on)}% { width:${w}%; } ${pct(on + SLIDE)}% { width:${nw}%; } `;
        w = nw;
      });
      return `@keyframes osseg${j} { ${kf}100% { width:${w}%; } }`;
    }).join(" ");
    const segs = last.map(([, c], j) => {
      const labels = states.map((s, k) => {
        const f = s.bar[j] ? s.bar[j][0] : 0;
        if (f < .07) return "";
        const off = k + 1 < states.length;
        return `<b class="${off ? "mid" : "last"}" style="--on:${T(k) + LAND + SLIDE / 2}s;--to:${T(k + 1) + LAND}s">${(f * 100).toFixed(0)}%</b>`;
      }).join("");
      return `<i style="background:var(--${c});animation:osseg${j} ${END}s ease-in-out both">${labels}</i>`;
    }).join("");
    const key = (c, n, x, t) => `<i class="osk" style="background:var(--${c});--x:${x}vw;--t:${t}s">${n}</i>`;
    const batches = BATCH.map((scores, b) => `<div class="osb"><span class="osl" style="--t:${T(b)}s">batch ${b + 1}</span><div>${scores.map((n, j) =>
      key(COL[b], n, -((b - 1.5) * 9 + (j ? 1.8 : -1.8)), T(b))).join("")}</div></div>`).join("");
    return `<div class="os"><div class="osbatches">${batches}</div>
      <div class="osbox"><div class="osf"><span>biggest score</span>${stack(states.map(s => s.max), "")}</div>
        <div class="osf"><span>running total</span>${stack(states.map(s => s.denom.toFixed(2)), "")}</div>
        <div class="osf"><span>running mix ÷ total</span><div class="osv wide"><style>${frames}</style><div class="osbar">${segs}</div></div></div></div>
      <div class="osout">same answer as one big softmax, and no score table</div></div>`;

    return `<div class="gw">
      <div class="grow"><span class="glab">K, already in memory</span><div class="strip gread">${cells(20, j => src.includes(j) ? "p" : "")}</div></div>
      ${tokens.map((t, r) => `<div class="grow gpos" style="--n:${r}"><span class="glab">token ${t} reads</span><div class="gchips">${src.map(x => `<span class="gchip">${x}</span>`).join("")}</div></div>`).join("")}
      <div class="gmore" style="--n:7">… only position numbers: each key is read, used, then dropped</div>
      <div class="grow"><span class="glab">K itself</span><div class="gbar" style="--n:8;width:3px;background:var(--p)"></div><span class="gval" style="--n:8">0.26 GB</span></div>
      <div class="grow"><span class="glab">copied keys</span><div class="gbar" style="--n:9;width:0"></div><span class="gval" style="--n:9">0 GB</span></div>
    </div>`;
  },
  gather: () => {
    const src = [3, 9, 15], tokens = [100, 101, 102, 103, 104];
    return `<div class="gw">
      <div class="grow"><span class="glab">K, already in memory</span><div class="strip">${cells(20, j => src.includes(j) ? "p" : "")}</div></div>
      ${tokens.map((t, r) => `<div class="grow gcopy" style="--n:${r}"><span class="glab">copy for token ${t}</span><div class="strip">${src.map((x, i) => `<i class="p" style="--i:${i};--sx:${x - i};--sy:${r + 1}"></i>`).join("")}</div></div>`).join("")}
      <div class="gmore" style="--n:8">… one copy for every token, in every head</div>
      <div class="grow"><span class="glab">K itself</span><div class="gbar" style="--n:9;width:3px;background:var(--p)"></div><span class="gval" style="--n:9">0.26 GB</span></div>
      <div class="grow"><span class="glab">all the copies</span><div class="gbar" style="--n:10;width:34vw;background:var(--r)"></div><span class="gval" style="--n:10">~530 GB</span></div>
    </div>`;
  },
  pair: () => `<canvas class="paircv" width="1200" height="460"></canvas>
    <div class="legend"><span><i style="background:var(--g)"></i>the beginning</span><span><i style="background:var(--b)"></i>nearby text</span>
      <span><i style="background:var(--p)"></i>routed spots</span><span><i style="background:var(--r)"></i>about to predict</span></div>`,
  route: s => {
    const SC = [14, 6, 22, 9, 18, 4, 11, 34, 8, 16, 26, 10, 7, 38, 13, 20, 9, 31, 12, 17, 8];
    const TOP = new Set([7, 13, 17]);
    const cols = SC.map((h, j) => {
      const cls = s.step >= 3 && j === 19 ? "r cur" : s.step >= 2 && TOP.has(j) ? "p" : "";
      return `<div class="rtcol"><i class="bar${s.step < 1 ? " off2" : ""}${s.step >= 2 && TOP.has(j) ? " win" : ""}" style="height:${h * 0.19}vw"></i><i class="cell ${cls}"></i></div>`;
    }).join("") + [0, 1, 2].map(() =>
      `<div class="rtcol"><i class="bar off2" style="height:2vw"></i><i class="cell e"></i></div>`).join("");
    const L = [
      ["#fff;border:2.5px solid #3a3f4a", "about to predict (last 64 tokens)", 0],
      ["#c9ced6;height:.55vw", "a score per earlier spot", 1],
      ["var(--p)", "top 512, kept", 2],
      ["var(--r)", "any token", 3]];
    const legend = L.map(([c, t, k]) =>
      `<span class="${s.step >= k ? "" : "off"}"><i style="background:${c}"></i>${t}</span>`).join("");
    return `<div class="rtrow">${cols}</div><div class="legend">${legend}</div>`;
  },
  scale: s => {
    const ROWS = [["32K tokens", 2.56], ["65K tokens", 5.2], ["128K tokens", 10.24], ["1M tokens", 80]];
    return `<div class="scwrap">` + ROWS.map(([lab, w]) =>
      `<div class="scrow"><span class="sclab">${lab}</span><div class="scbar" style="width:${w}vw"><i class="scwin">${s.step >= 1 ? "16K" : ""}</i></div></div>`).join("") +
      (s.step >= 2 ? `<div class="scnote">64 at the start &nbsp;·&nbsp; 16,000 nearby &nbsp;·&nbsp; 512 chosen spots &nbsp;·&nbsp; 256 for the question. None of these grow</div>` : "") +
      `</div>`;
  },
  expl: s => {
    const W = 900, H = 400, pad = 70, N = 1048576;
    const x = n => pad + (n / N) * (W - pad - 20), y = v => H - pad - (v / 550e9) * (H - pad - 30);
    const quad = [], lin = [];
    for (let n = 8192; n <= N; n *= Math.SQRT2) { quad.push(`${x(n)},${y(n * n / 2)}`); lin.push(`${x(n)},${y(n * 16960)}`); }
    quad.push(`${x(N)},${y(N * N / 2)}`); lin.push(`${x(N)},${y(N * 16960)}`);
    const ticks = [32768, 131072, 262144, 524288, 1048576].map(n =>
      `<text x="${x(n)}" y="${H - pad + 26}" font-size="17" fill="#8a93a3" text-anchor="middle">${n >= 1e6 ? "1M" : n / 1024 + "K"}</text>` +
      `<line x1="${x(n)}" y1="${H - pad + 4}" x2="${x(n)}" y2="${H - pad}" stroke="#c9ced6"/>`).join("");
    const here = `<line x1="${x(131072)}" y1="${y(8.6e9)}" x2="${x(131072)}" y2="${H - pad}" stroke="#c9ced6" stroke-dasharray="4"/>` +
      `<circle cx="${x(131072)}" cy="${y(8.6e9)}" r="6" fill="#e4572e"/>` +
      `<text x="${x(131072)}" y="${y(8.6e9) - 14}" font-size="19" font-weight="700" fill="#e4572e" text-anchor="middle">8 billion (128K)</text>` +
      `<circle cx="${x(N)}" cy="${y(N * N / 2)}" r="6" fill="#1f4fd8"/>` +
      `<text x="${x(N) - 14}" y="${y(N * N / 2) - 14}" font-size="19" font-weight="700" fill="#1f4fd8" text-anchor="end">550 billion (1M)</text>`;
    const linlab = `<text x="${x(524288)}" y="${y(524288 * 16960) - 14}" font-size="19" font-weight="700" fill="#57a04e" text-anchor="middle">Bigger Bird, linear in theory</text>`;
    return `<div class="expl"><svg viewBox="0 0 ${W} ${H + 40}">
      <line x1="${pad}" y1="${H - pad}" x2="${W - 20}" y2="${H - pad}" stroke="#8a93a3" stroke-width="2"/>
      <line x1="${pad}" y1="${H - pad}" x2="${pad}" y2="20" stroke="#8a93a3" stroke-width="2"/>
      <text x="18" y="${(H - pad) / 2}" font-size="17" fill="#8a93a3" transform="rotate(-90 18 ${(H - pad) / 2})" text-anchor="middle">comparisons</text>${ticks}${here}
      <polyline points="${quad.join(" ")}" fill="none" stroke="#1f4fd8" stroke-width="4"/>
      <polyline points="${lin.join(" ")}" fill="none" stroke="#57a04e" stroke-width="4" stroke-dasharray="9 6"/>${linlab}
    </svg></div>`;
  },
  wall: s => `<div class="wall">${WALL.map(([n, t], j) => {
      const k = j + 1, era2 = k >= 16;
      const cls = s.step === 0 ? "" : s.step === 1 ? (era2 ? "dim" : "hi") : (era2 ? (k === 19 ? "last" : "hi") : "dim");
      return `<div class="wt ${cls}"><b>#${k}</b><span>${t}</span></div>`;
    }).join("")}</div>`,
  stats: s => `<div class="stats">${STATS.map(([n, l], j) =>
      `<div class="stat${s.step > j ? "" : " off"}"><div class="sn">${n}</div><div class="sl">${l}</div></div>`).join("")}</div>`,
  board: s => `<table class="board"><tr><th>Approach</th><th>~65K tokens</th><th>~128K tokens</th></tr>` + BOARD.map(([a, x, y, cls, note], j) =>
      `<tr><td>${a}${note ? ` <small>${note}</small>` : ""}</td><td class="n">${x}</td><td class="n ${cls}">${y}</td></tr>`).join("") + `</table>`,
  tests: () => `<div class="chips">${["One hidden fact", "Lookalike facts", "Many answers", "Many questions", "Long random IDs", "Real text"].map((m, j) =>
      `<span class="chip${j === 0 ? " hl" : ""}">${m}</span>`).join("")}</div>`,
  ex: s => `<div class="exbox"><div class="extag">${EX[s.ex][0]}</div><div class="exrule">RULER &middot; ${EX[s.ex][1]}</div><div class="prompt">${EX[s.ex][2]}</div></div>`,
  exgrid: s => `<div class="exgrid">` + EX.slice(0, 6).map(e =>
    `<div class="exbox"><div class="extag">${e[0]}</div><div class="exrule">RULER &middot; ${e[1]}</div><div class="prompt">${e[2]}</div></div>`).join("") + `</div>`,
  prompt: () => `<div class="exbox big"><div class="extag">One hidden fact</div><div class="exrule">RULER &middot; niah_single_1</div><div class="prompt">${PROMPT}</div></div>`,
  prompt2: () => `<div class="exbox"><div class="extag">Many answers</div><div class="exrule">RULER &middot; niah_multivalue</div><div class="prompt">${PROMPT2}</div></div>`,
};

const deck = document.getElementById("deck");
S.forEach(s => {
  const el = document.createElement("section");
  const kind = s.vis ? "stage" : s.kind === "photo" ? "k-img k-photo" : s.kind ? "k-" + s.kind : "";
  el.className = "slide " + kind + (s.tl !== undefined && s.kind !== "timeline" ? " hastl" : "");
  let html = "";
  if (s.corner) html += `<img class="corner" src="${A}utmist_logo.png" alt="UTMIST">`;
  if (s.vis) {
    html += `<div class="vis">${VIS[s.vis](s)}</div><div class="cap"><p class="say">${s.say}</p>${s.sub ? `<p class="sub">${s.sub}</p>` : ""}</div>`;
  } else if (s.kind === "bento") {
    html += `<div class="bento">` + BENTO.map(b => b.cls === "center"
      ? `<div class="tile center"><img src="${A}bigger_bird_logo.png" alt=""><div class="cn">Bigger Bird</div><div class="cs">Content-aware sparse attention for long documents</div></div>`
      : b.cls === "chart" ? `<div class="tile chart"><img src="${b.img}" alt=""></div>`
      : `<div class="tile ${b.cls || ""}"><div class="tn">${b.n}</div><div class="tt">${b.t}</div>${b.s ? `<div class="ts">${b.s}</div>` : ""}</div>`).join("") + `</div>`;
  } else {
    if (s.rule) html += `<div class="ruletag">${s.rule}</div>`;
    if (s.kind === "timeline" || s.tl !== undefined)
      html += (s.tag ? `<div class="tltag">${s.tag}</div>` : "") +
        `<div class="timeline">${TIMELINE.map(([d, t], j) =>
        `<div class="tl${s.tl === undefined ? "" : (Array.isArray(s.tl) ? j >= s.tl[0] && j <= s.tl[1] : j === s.tl) ? " on" : " off"}"><b>${d}</b><span>${t}</span></div>`).join("")}</div>`;
    if (s.kind === "hero")
      html += `<div class="row"><img src="${A}bigger_bird_logo.png" alt="Bigger Bird"><div><div class="big">Bigger Bird</div><div class="small">Content-Aware Sparse Transformer Attention</div></div></div>`;
    if (s.kind === "ctable")
      html += `<p class="say" style="margin:0 0 .7em">${s.say}</p><table class="ctable"><tr>` +
              CTABLE[0].map(h => `<th>${h}</th>`).join("") + `</tr>` +
              CTABLE.slice(1).map((r, ri) => `<tr${ri === 4 ? ' class="ours"' : ""}>` + r.map(c => `<td>${c}</td>`).join("") + `</tr>`).join("") + `</table>`;
    if (s.kind === "todo")
      html += `<p class="say" style="margin:0 0 .9em">${s.say}</p><div class="readlist todo">` +
              TODO.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
    if (s.kind === "readlist")
      html += `<p class="say" style="margin:0 0 .9em">${s.say}</p><div class="readlist">` +
              READLIST.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
    if (s.kind === "team")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + TEAM.map(p =>
        `<div class="p"><div class="pimg">${face(p, "face")}</div><p class="pname">${p.name}</p><p class="prole">${p.role}</p>` +
        `<ul>${p.pts.map(t => `<li>${t}</li>`).join("")}</ul>` +
        `${p.tag ? `<div class="ptag"><span class="curl">}</span>${p.tag}</div>` : ""}</div>`).join("") + `</div>`;
    if (s.kind === "partners")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + PARTNERS.map(p =>
        `<div class="p"><div class="pimg">${face(p, p.round || p.initial ? "face" : "plogo")}</div>` +
        `${p.name ? `<p class="pname">${p.name}</p>` : ""}<p class="pcap">${p.cap}</p></div>`).join("") + `</div>`;
    if (s.img && !["partners", "team"].includes(s.kind)) html += `<img src="${s.img}" alt="">`;
    if (s.kind === "num") html += `<div class="num">${s.num}</div>`;
    if (s.say && !["readlist", "todo", "ctable", "team", "partners"].includes(s.kind)) html += `<p class="say">${s.say}</p>`;
    if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  }
  el.innerHTML = html;
  deck.appendChild(el);
});

// Growth animation: n tokens double each cycle; the triangle of comparisons fills in.
document.querySelectorAll(".quadcv").forEach(cv => {
  const lab = cv.parentElement.querySelector(".quadlab"), ctx = cv.getContext("2d");
  const seq = [8, 16, 32, 64, 128];
  function draw() {
    const t = performance.now() / 2400;
    const n = seq[Math.floor(t) % seq.length];
    const lim = Math.ceil(Math.min(1, (t % 1) * 2.2) * n * (n + 1) / 2);
    const size = 430, mx = (660 - size) / 2, my = 18, cs = size / n;
    ctx.clearRect(0, 0, 660, 480);
    ctx.fillStyle = "#1f4fd8";
    let drawn = 0;
    for (let r = 0; r < n && drawn < lim; r++)
      for (let c = 0; c <= r && drawn < lim; c++, drawn++)
        ctx.fillRect(mx + c * cs, my + r * cs, Math.max(1, cs - 0.6), Math.max(1, cs - 0.6));
    lab.innerHTML = `<b>${n}</b> tokens → <b>${(n * (n + 1) / 2).toLocaleString()}</b> comparisons`;
    requestAnimationFrame(draw);
  }
  draw();
});

// Dense vs Bigger Bird: attention grids fill row by row (one row = one token's reads), with live counters.
const CMP_N = 48, CMP_ROUTED = [7, 14, 21, 28, 35], CMP_TAIL = 4, CMP_WIN = 8;
const cmpCell = (k, r, c) => {
  if (c > r) return null;
  if (k === "dense") return "#1f4fd8";
  if (r >= CMP_N - CMP_TAIL) return c === r ? "#e06666" : "#f7c9c9";
  if (c < 2) return "#a8d5a2";
  if (r - c < CMP_WIN) return "#a9c4f5";
  if (CMP_ROUTED.includes(c)) return "#b9a6dc";
  return null;
};
const cmpRowOps = (k, r) => { let n = 0; for (let c = 0; c <= r; c++) if (cmpCell(k, r, c)) n++; return n; };
document.querySelectorAll(".cmpcv").forEach(cv => {
  const k = cv.dataset.k, ctx = cv.getContext("2d"), cn = cv.closest(".cmpp").querySelector(".cn");
  const slide = cv.closest(".slide"), S0 = 440, cs = S0 / CMP_N, DUR = 3600, HOLD = 2600;
  function draw() {
    requestAnimationFrame(draw);
    if (!slide.classList.contains("active")) return;
    const t = (performance.now() - (slide._t0 || 0)) % (DUR + HOLD);
    const rows = Math.min(CMP_N, Math.floor(t / DUR * CMP_N) + 1);
    ctx.clearRect(0, 0, S0, S0);
    ctx.fillStyle = "#f1f3f7";
    for (let r = 0; r < CMP_N; r++) for (let c = 0; c <= r; c++) ctx.fillRect(c * cs, r * cs, cs - .8, cs - .8);
    let ops = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c <= r; c++) {
      const col = cmpCell(k, r, c);
      if (col) { ctx.fillStyle = col; ctx.fillRect(c * cs, r * cs, cs - .8, cs - .8); ops++; }
    }
    if (rows < CMP_N) { ctx.fillStyle = "#e06666"; ctx.fillRect(0, (rows - 1) * cs, 3, cs - .8); }
    cn.textContent = ops.toLocaleString();
  }
  draw();
});

// Pairwise view: step through tokens one at a time; the current token draws arcs to everything it reads.
const PR_N = 24, PR_ROUTED = [6, 12, 17], PR_TAIL = 2, PR_WIN = 3;
const prTargets = (k, j) => {
  const out = [];
  for (let i = 0; i < j; i++) {
    if (k === "dense") { out.push([i, "#1f4fd8"]); continue; }
    if (j >= PR_N - PR_TAIL) out.push([i, "#e06666"]);
    else if (i < 2) out.push([i, "#7cc174"]);
    else if (j - i <= PR_WIN) out.push([i, "#6f9cf0"]);
    else if (PR_ROUTED.includes(i)) out.push([i, "#9b82d0"]);
  }
  return out;
};
document.querySelectorAll(".paircv").forEach(cv => {
  const ctx = cv.getContext("2d"), slide = cv.closest(".slide"), W = 1200, pad = 230, cw = (W - pad - 30) / PR_N;
  const STEP = 200, HOLD = 1800, cx = i => pad + i * cw + cw / 2;
  const cumT = [0];
  for (let j = 0; j < PR_N; j++) cumT.push(cumT[j] + STEP * (j >= PR_N - 3 ? 3.5 : 1));
  const TOTAL = cumT[PR_N];
  const arc = (y, j, i, col, a, lw) => {
    const h = Math.min(120, (cx(j) - cx(i)) * .32 + 14);
    ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx(j), y - 4); ctx.quadraticCurveTo((cx(i) + cx(j)) / 2, y - h, cx(i), y - 4); ctx.stroke();
  };
  const row = (y, k, name, cur) => {
    let ops = 0;
    for (let j = 1; j < cur; j++) { const t = prTargets(k, j); ops += t.length; t.forEach(([i, col]) => arc(y, j, i, col, .07, 2)); }
    const tg = cur < PR_N ? prTargets(k, cur) : [];
    tg.forEach(([i, col]) => arc(y, cur, i, col, .9, 3.2));
    ops += tg.length;
    ctx.globalAlpha = 1;
    for (let i = 0; i < PR_N; i++) {
      const hit = tg.find(t => t[0] === i);
      ctx.fillStyle = i === cur ? "#e06666" : hit ? hit[1] : i < cur ? "#dfe3ea" : "#f1f3f7";
      ctx.beginPath(); ctx.roundRect(cx(i) - cw / 2 + 3, y, cw - 6, 34, 6); ctx.fill();
    }
    ctx.fillStyle = "#14171f"; ctx.font = "800 26px Inter, Helvetica, sans-serif"; ctx.fillText(name, 10, y - 8);
    ctx.font = "800 30px Inter, Helvetica, sans-serif"; ctx.fillText(ops.toLocaleString(), 10, y + 30);
    const w = ctx.measureText(ops.toLocaleString()).width;
    ctx.fillStyle = "#8a93a3"; ctx.font = "500 18px Inter, Helvetica, sans-serif"; ctx.fillText("comparisons", 18 + w, y + 30);
  };
  function draw() {
    requestAnimationFrame(draw);
    if (!slide.classList.contains("active")) return;
    const t = (performance.now() - (slide._t0 || 0)) % (TOTAL + HOLD);
    let cur = PR_N; while (cur > 0 && t < cumT[cur - 1]) cur--;
    cur = Math.max(1, Math.min(PR_N, cur));
    ctx.clearRect(0, 0, W, 460);
    row(185, "dense", "Dense", cur);
    row(415, "bb", "Bigger Bird", cur);
  }
  draw();
});

const mainCount = S.findIndex(s => s.kind === "section" && s.say === "Appendix");
const slides = [...document.querySelectorAll(".slide")];
let i = Math.max(0, Math.min(slides.length - 1, parseInt(location.hash.slice(1) || "1") - 1));
const pvw = document.getElementById("pvw"), pvwin = document.getElementById("pvwin"), timerEl = document.getElementById("timer");
let t0 = null;
setInterval(() => {
  if (t0 === null) return;
  const s = Math.floor((Date.now() - t0) / 1000);
  timerEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}, 500);
const show = () => {
  slides.forEach((s, j) => { if (j === i && !s.classList.contains("active")) s._t0 = performance.now(); s.classList.toggle("active", j === i); });
  document.getElementById("num").textContent = i < mainCount ? `${i + 1} / ${mainCount}` : `appendix ${i - mainCount}`; location.hash = i + 1;
  if (i === 0) { t0 = null; timerEl.textContent = ""; } else if (t0 === null) t0 = Date.now();
  pvwin.innerHTML = "";
  if (i + 1 < slides.length) {
    pvw.style.display = "";
    pvwin.style.transform = `scale(${pvwin.parentElement.clientWidth / innerWidth})`;
    const c = slides[i + 1].cloneNode(true); c.classList.add("active"); c.removeAttribute("id");
    pvwin.appendChild(c);
  } else pvw.style.display = "none";
};
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) i = Math.max(0, i - 1);
  show();
});
addEventListener("resize", () => show());
document.addEventListener("click", e => { i = e.clientX > innerWidth / 2 ? Math.min(slides.length - 1, i + 1) : Math.max(0, i - 1); show(); });
show();
</script>
</body>
</html>
