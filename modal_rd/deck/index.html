<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bigger Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fg:#111418; --muted:#6b7280; --accent:#1f4fd8; --good:#1a7f37; --bad:#cf222e;
          --g:#a8d5a2; --b:#a9c4f5; --o:#f7c48f; --p:#b9a6dc; --r:#e06666; --y:#fde49c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#eceef1; color:var(--fg);
               font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .slide { display:none; position:absolute; top:1vh; left:50%; transform:translateX(-50%);
           width:min(96vw, 160vh); height:min(54vw, 90vh);
           background:#fff; padding:5% 8%; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden;
           flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .slide.active { display:flex; }
  .say { font-size:3.3vw; font-weight:700; line-height:1.25; letter-spacing:-.015em; margin:0; max-width:90%; text-wrap:balance; }
  .sub { font-size:1.6vw; color:var(--muted); margin:.9em 0 0; max-width:85%; line-height:1.4; }
  .slide img { max-width:100%; max-height:62vh; object-fit:contain; }
  .k-img .say { font-size:2.4vw; margin-top:.6em; }
  .k-photo img { border-radius:12px; max-height:64vh; }
  .k-section .say { font-size:4.4vw; font-weight:800; color:var(--accent); }
  .secnum { display:block; font-size:1.3vw; font-weight:700; color:#9aa3b2; letter-spacing:.28em; margin-bottom:1em; }
  .num { font-size:9vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .corner { position:absolute; top:4%; right:4%; height:7%; max-height:none !important; }
  .footer { position:absolute; bottom:2.5%; left:calc(4% + 4vw); font-size:.9vw; color:var(--muted); }
  .timer { position:absolute; bottom:2.5%; left:4%; font-size:.9vw; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pvw { position:absolute; bottom:1vh; right:2%; height:6.5vh; aspect-ratio:16/9; overflow:hidden;
         border:1px solid #e3e6ee; border-radius:6px; background:#fff; opacity:.95;
         box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .pvw .in { position:relative; width:100vw; height:100vh; transform-origin:top left; pointer-events:none; }
  .pvw .in .slide { display:flex; }

  /* Title */
  .k-hero .row { display:flex; align-items:center; gap:3.5vw; position:absolute; top:30%; left:50%; transform:translateX(-50%); }
  .k-hero .row img { max-height:23vh; }
  .k-hero .big { font-size:5.5vw; font-weight:800; letter-spacing:-.02em; line-height:1.1; text-align:left; white-space:nowrap; }
  .k-hero .small { font-size:2.1vw; font-weight:500; color:var(--muted); margin-top:.5em; text-align:left; }
  .k-hero .say { position:absolute; top:68%; left:8%; right:8%; margin:0; }

  /* Stage: visual stays fixed in the middle, the sentence changes at the bottom */
  .stage .vis { position:absolute; top:7%; bottom:27%; left:6%; right:6%;
                display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage .vis > img { max-height:100%; max-width:100%; }
  .stage .cap { position:absolute; top:76%; left:7%; right:7%; display:flex; flex-direction:column; align-items:center; }
  .stage .cap .say { font-size:2.6vw; max-width:100%; }
  .stage .cap .sub { font-size:1.4vw; margin-top:.5em; }

  /* Tokens */
  .toks { display:flex; gap:.6vw; flex-wrap:wrap; justify-content:center; }
  .tok { font-size:2.4vw; font-weight:600; padding:.35em .6em; border-radius:.4em; border:2px solid #d8dde3; background:#fff; }
  .tok.back { background:#e8efff; border-color:var(--b); }
  .tok.cur { background:var(--accent); border-color:var(--accent); color:#fff; }
  .toknote { font-size:1.4vw; color:var(--muted); margin-top:1.2em; }

  /* Attention formula */
  .formula { font-family: "Times New Roman", Georgia, serif; font-size:3.2vw; margin-bottom:.9em; }
  .formula .qc { color:#b8860b; font-style:italic; } .formula .kc { color:#0f8f8f; font-style:italic; }
  .vecs { display:flex; gap:3vw; }
  .vec { border:3px solid; border-radius:10px; padding:.5em .9em; font-family:"Times New Roman", Georgia, serif;
         font-style:italic; font-size:2.3vw; word-spacing:.45em; }
  .vec.vq { border-color:#e0b400; color:#b8860b; } .vec.vk { border-color:#2bb3b3; color:#0f8f8f; }
  .vec sub { font-size:.6em; letter-spacing:0; }

  /* Growth animation */
  .quadcv { height:100%; max-height:44vh; aspect-ratio: 660 / 480; }
  .quadlab { font-size:1.9vw; font-weight:600; color:var(--muted); margin-top:.3em; }
  .quadlab b { color:var(--accent); font-weight:800; }

  /* Model chips */
  .chips { display:flex; flex-wrap:wrap; gap:1vw; justify-content:center; max-width:80%; }
  .chip { font-size:2vw; font-weight:700; padding:.45em .9em; border-radius:999px; background:#f2f4f7; }
  .chip.hl { background:var(--accent); color:#fff; }

  /* Big Bird grids */
  .bbrow { display:flex; align-items:center; gap:1.6vw; }
  .bbp { display:flex; flex-direction:column; align-items:center; transition:opacity .2s; }
  .bbp.off, .op.off { opacity:.12; }
  .grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:2px; width:15vw; }
  .grid i { aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .grid i.g { background:var(--g); border-color:#86c07f; } .grid i.b { background:var(--b); border-color:#7fa6ee; }
  .grid i.o { background:var(--o); border-color:#eba25c; }
  .bbp b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.7em; }
  .op { font-size:3vw; font-weight:800; color:#7fa6ee; }
  .grid.kg { grid-template-columns:repeat(20, 1fr); width:min(23vw, 40vh); }
  .grid.kg i { border-width:1px; }
  .grid i.d { background:var(--accent); border-color:var(--accent); } .grid i.p { background:var(--p); border-color:#9a83c8; }
  .grid i.t { background:#f7c9c9; border-color:#eda9a9; }
  .grid.kg i:not([class=""]) { animation:kfill .04s linear both; animation-delay:calc(var(--d) * 2ms); }
  @keyframes kfill { from { background:#fff; border-color:#c9ced6; } }
  /* Masking: a soft red band sweeps over every cell, kept or not */
  .grid i.m { background:#e3e6ec; border-color:#cfd3da; }
  .grid.kg.scan i:not([class=""]) { animation:none; position:relative; }
  .grid.kg.scan i::after { content:""; position:absolute; inset:-1px; border-radius:2px; background:var(--r); opacity:0;
                           animation:kscan 9s linear infinite; animation-delay:calc(var(--d) * 18ms); }
  @keyframes kscan { 0% { opacity:.6; } 10%, 100% { opacity:0; } }

  /* Gather: the same keys copied once per token */
  .gw { display:flex; flex-direction:column; gap:.45vw; align-items:flex-start; }
  .grow { display:flex; align-items:center; gap:1vw; }
  .glab { width:15vw; text-align:right; font-family:ui-monospace, Menlo, monospace; font-size:1.15vw; color:#3a3f4a; }
  .gw .strip i { width:1.7vw; }
  .gmore { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .3s + .2s); }
  .gcopy .glab { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .4s + .7s); }
  .gcopy .strip i { position:relative; z-index:1; animation:gfly .45s ease-in-out both;
                    animation-delay:calc(var(--n) * .4s + var(--i) * .07s + .4s); }
  @keyframes gfly { from { transform:translate(calc(var(--sx) * (1.7vw + 3px)), calc(var(--sy) * -2.15vw)); } }
  @keyframes gpop { from { opacity:0; transform:translateY(-1vw); } }
  .gmore { font-size:1.2vw; font-weight:600; color:var(--muted); margin:.1vw 0 .6vw 16vw; }
  .gbar { height:1.5vw; border-radius:.25vw; transform-origin:left; animation:gbar .6s ease-out both; animation-delay:calc(var(--n) * .3s + .2s); }
  @keyframes gbar { from { transform:scaleX(0); } }
  /* One softmax: a token's keys leave the document row and line up in one box */
  .smsrc { margin-bottom:6.5vw; position:relative; }
  .smarrow { position:absolute; bottom:calc(100% + .5vw); left:calc(var(--c) * (3vw + 3px) + 1.5vw); transform:translateX(-50%);
             display:flex; flex-direction:column; align-items:center; color:var(--r); font-size:1.4vw; font-weight:700; white-space:nowrap; line-height:1.15; }
  .smarrow b { font-size:2.2vw; line-height:1; }
  .strip.smsrc i, .smbox .strip i { width:3vw; }
  .smbox { display:flex; flex-direction:column; align-items:center; padding:1.5vw 1.7vw .9vw; border:3px solid #3a3f4a; border-radius:.8vw;
           animation:smon .4s ease both; animation-delay:2.1s; }
  @keyframes smon { from { border-color:#dfe3ea; } }
  .smbox .strip i { position:relative; z-index:1; animation:smfly .5s ease-in-out both; animation-delay:calc(var(--i) * .15s + .4s); }
  @keyframes smfly { from { transform:translate(calc(var(--sx) * (3vw + 3px) - 12vw), calc(-11vw - 3px)); } }
  .smwrap { display:flex; align-items:stretch; gap:3vw; }
  .smscore { width:21vw; display:flex; flex-direction:column; justify-content:center; gap:.35vw;
             text-align:left; white-space:nowrap; font-size:2vw; }
  .smscore div { display:flex; align-items:center; gap:.5vw; }
  .smscore i { width:1.9vw; height:1.9vw; border-radius:3px; display:inline-block; }
  .smscore b { font-weight:800; min-width:3vw; }
  .smbox .strip i { display:flex; align-items:center; justify-content:center; }
  .smx { display:block; font-style:normal; font-size:1.55vw; font-weight:800; color:#3a3f4a; animation:smpop .3s cubic-bezier(.3, 1.6, .6, 1) both; animation-delay:calc(var(--i) * .07s + 2.5s); }
  .smx.hi { color:#4b2e96; }
  @keyframes smpop { from { opacity:0; transform:scale(0); } }
  .smlab { font-family:ui-monospace, Menlo, monospace; font-size:1.7vw; font-weight:700; margin-top:.7vw; animation:gpop .3s ease-out both; animation-delay:2.1s; }
  /* Tiling: the read cells of each 4-row band move into their program's slot at the same time */
  .tgw2 { display:flex; flex-direction:column; align-items:center; }
  .grid.tg2 { gap:.08vw; width:auto; }
  .grid.tg2.tgsrc { grid-template-columns:repeat(19, .92vw); }
  .grid.tg2 { grid-template-columns:repeat(9, .92vw); }
  .grid.tg2 i { width:.92vw; border-width:1px; border-radius:1px; }
  .tgsrc i:not([class=""]) { animation:tgfade .8s ease-in-out both; animation-delay:.7s; }
  @keyframes tgfade { to { opacity:.3; } }
  .tgslots { display:flex; gap:2vw; margin-top:2.2vw; }
  .tgslot { padding:.6vw; border:2px solid #3a3f4a; border-radius:.6vw; display:flex; flex-direction:column; align-items:center; }
  .tgslot .grid.tg2 i[class=""] { border-color:transparent; background:transparent; }
  .tgslot .grid.tg2 i:not([class=""]) { position:relative; z-index:1; animation:tgmove .8s ease-in-out both; animation-delay:.7s; }
  @keyframes tgmove { from { transform:translate(calc(var(--dc) * 1vw + (1.5 - var(--k)) * (12.12vw + 4px)), calc(var(--dr) * 1vw - 18.72vw - 2px)); } }
  .tglab2 { font-family:ui-monospace, Menlo, monospace; font-size:1.25vw; font-weight:700; margin-top:.5vw; }
  /* Online softmax: batches fly into the running values and vanish; the values update each time */
  .os { display:flex; flex-direction:column; align-items:center; }
  .osbatches { display:flex; gap:2.2vw; margin-bottom:3.5vw; }
  .osb { display:flex; flex-direction:column; align-items:center; font-family:ui-monospace, Menlo, monospace; font-size:1.2vw; color:#3a3f4a; }
  .osb div { display:flex; gap:.4vw; margin-top:.4vw; }
  .osl { animation:osoff .25s calc(var(--t) + .25s) forwards; }
  .osk { width:3.2vw; height:3.2vw; border-radius:.3vw; display:flex; align-items:center; justify-content:center; font:800 1.6vw Inter, sans-serif; font-style:normal; color:#3a3f4a;
         animation:osfly .5s ease-in both; animation-delay:var(--t); }
  @keyframes osfly { to { transform:translate(var(--x), 7vw) scale(.35); opacity:0; } }
  .osbox { display:flex; gap:2.5vw; padding:1vw 2vw; border:3px solid #3a3f4a; border-radius:.8vw; }
  .osf { display:flex; flex-direction:column; align-items:center; }
  .osf > span { font-size:1.15vw; font-weight:600; color:var(--muted); margin-bottom:.35vw; white-space:nowrap; }
  .osv { display:grid; justify-items:center; align-items:center; min-height:2.6vw; font-size:1.9vw; font-weight:800; font-variant-numeric:tabular-nums; }
  .osv > b { grid-area:1 / 1; font-weight:800; white-space:nowrap; }
  .osv .off { color:#c9ced6; animation:osoff .15s var(--to) forwards; }
  .osv .mid { animation:oson .2s var(--on) both, osoff .15s var(--to) forwards; }
  .osv .last { animation:oson .2s var(--on) both; }
  @keyframes oson { from { opacity:0; } }
  @keyframes osoff { to { opacity:0; } }
  .osv.wide { width:32vw; display:block; }
  .osbar { display:flex; height:2.6vw; width:100%; }
  .osbar i { flex:none; display:grid; align-items:center; justify-items:center; font:700 1.05vw Inter, sans-serif; font-style:normal; color:#3a3f4a; overflow:hidden; box-shadow:inset -2px 0 #fff; }
  .osbar i b { grid-area:1 / 1; font-weight:700; }
  .osout { margin-top:1.1vw; font-size:1.5vw; font-weight:700; color:var(--accent); animation:gpop .35s ease-out both; animation-delay:6.3s; }
  /* In place: tokens hold position numbers only; K's own cells light up as they get read */
  .gw .strip.gread i.p { animation:gring .4s ease-out 5; animation-delay:.55s; }
  @keyframes gring { 0% { box-shadow:0 0 0 .25vw var(--accent); transform:scale(1.15); } 100% { box-shadow:0 0 0 0 var(--accent); transform:scale(1); } }
  .gchip { display:flex; align-items:center; justify-content:center; width:2.6vw; height:1.7vw; border:1.5px dashed #9a83c8; border-radius:2px;
           font:700 1.05vw ui-monospace, Menlo, monospace; color:#4b2e96; }
  .gchips { display:flex; gap:3px; }
  .gpos { animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .4s + .4s); }
  /* Exact tail: settings change, then the nearby window stretches left over the whole document */
  .xtrow { display:flex; flex-direction:column; align-items:center; margin-top:3.4vw; }
  .strip.smsrc.xt { margin-bottom:.7vw; }
  .xtset { font-size:1.4vw; color:var(--muted); } .xtset b { color:var(--fg); font-weight:800; }
  /* Recompile: the same four prompts, before and after lengths became run-time values */
  .rcw { display:flex; flex-direction:column; align-items:center; gap:1vw; }
  .rcbox { display:flex; flex-direction:column; align-items:center; gap:.4vw; margin-top:.3vw; }
  .rctitle { font-size:1.25vw; font-weight:700; color:#3a3f4a; }
  .rcbox .osbox { padding:.5vw 2vw; }
  .rcbox .osf > span { font-family:ui-monospace, Menlo, monospace; }
  .rcbox .osv { min-width:8vw; font-size:1.6vw; min-height:2vw; }
  .rcrow { display:flex; align-items:center; gap:1.2vw; }
  .rclab { width:7vw; text-align:right; font-size:1.7vw; font-weight:800; }
  .rccard { width:13vw; border:2px solid #d8dde3; border-radius:.7vw; padding:.45vw 0; display:flex; flex-direction:column; align-items:center; gap:.3vw;
            animation:gpop .3s ease-out both; animation-delay:calc(var(--n) * 1.1s + .3s); }
  .rclen { font-family:ui-monospace, Menlo, monospace; font-size:1.25vw; color:#3a3f4a; }
  .rcst { font-size:1.35vw; font-weight:800; padding:.2em .7em; border-radius:.4em; }
  .rcst.c { background:#f7c9c9; color:#a32c2c; } .rcst.u { background:var(--g); color:#1f5c1a; }
  .gval { font-size:1.25vw; font-weight:800; animation:gpop .25s ease-out both; animation-delay:calc(var(--n) * .3s + .5s); }
  .kgw { position:relative; }
  .kax { font-family: ui-monospace, Menlo, monospace; font-size:1.2vw; color:#3a3f4a; white-space:nowrap; display:flex; align-items:center; }
  .kax svg { display:block; overflow:visible; fill:none; stroke:#8a93a3; stroke-width:2; }
  .kax svg path { vector-effect:non-scaling-stroke; }
  .kax.top { flex-direction:column; margin-bottom:.4vw; }
  .kax.top svg { width:100%; height:.9vw; margin-top:.25vw; }
  .kax.left { position:absolute; right:100%; top:0; bottom:0; margin-right:.5vw; }
  .kax.left svg { width:.9vw; height:100%; margin-left:.5vw; }

  /* Window strips */
  .strip { display:flex; gap:3px; }
  .strip i { width:2.4vw; aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .strip i.y { background:var(--y); border-color:#efc95a; } .strip i.p { background:var(--p); border-color:#9a83c8; }
  .strip i.r { background:var(--r); border-color:#c94a4a; } .strip i.g { background:var(--g); border-color:#86c07f; }
  .strip i.b { background:var(--b); border-color:#7fa6ee; } .strip i.q { background:#3a3f4a; border-color:#3a3f4a; }
  .strip i.cur { outline:3px solid var(--r); outline-offset:1px; }
  .wrow { display:flex; flex-direction:column; align-items:center; margin:.9em 0; transition:opacity .2s; }
  .wrow.off { opacity:.3; }
  .wrow b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.5em; }
  .legend { display:flex; gap:2vw; margin-top:1.6em; }
  .legend span { font-size:1.35vw; display:flex; align-items:center; gap:.5em; transition:opacity .2s; }
  .legend span.off { opacity:.15; }
  .legend i { width:1.4vw; height:1.4vw; border-radius:3px; display:inline-block; }

  .strip i.e { border-color:#3a3f4a; border-width:2.5px; } .strip i.all { background:#e3e6ec; border-color:#cfd3da; }

  /* Routing scan: how the end picks spots */
  .rtrow { display:flex; gap:3px; align-items:flex-end; }
  .rtcol { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:9.5vw; gap:5px; }
  .rtcol .bar { width:1.1vw; border-radius:2px 2px 0 0; background:#c9ced6; transition:opacity .25s; }
  .rtcol .bar.win { background:var(--p); }
  .rtcol .bar.off2 { opacity:0; }
  .rtcol .cell { width:2.4vw; height:2.4vw; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; transition:background .25s; }
  .rtcol .cell.e { border-color:#3a3f4a; border-width:2.5px; }
  .rtcol .cell.p { background:var(--p); border-color:#9a83c8; }
  .rtcol .cell.r { background:var(--r); border-color:#c94a4a; }
  .rtcol .cell.cur { outline:3px solid var(--r); outline-offset:1px; }

  /* PART 5: one visual beat per routing operation. Values are real; mini-grids are labeled schematics. */
  .flowviz { width:88%; display:flex; flex-direction:column; align-items:center; gap:1vw; }
  .flowtitle { font-size:1.15vw; font-weight:700; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  .docline { display:flex; align-items:center; gap:.22vw; width:100%; }
  .docline i { flex:1; height:2.2vw; min-width:2px; background:#e6e9ef; border-radius:.18vw; }
  .docline i.sink { background:var(--g); }
  .docline i.needle { background:var(--p); }
  .docline i.query { background:var(--r); }
  .docline i.routed { background:var(--p); animation:routepop .45s ease-out both; animation-delay:calc(var(--n) * 12ms); }
  .docline i.window { background:var(--b); }
  .docline i.dim { opacity:.3; }
  @keyframes routepop { from { opacity:.2; transform:translateY(-.6vw) scaleY(.45); } }
  .doclabels { width:100%; display:flex; justify-content:space-between; font-size:1vw; color:var(--muted); }
  .querylayout { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:3vw; width:83%; }
  .querydoc { width:100%; }
  .querydoc .docline i { height:1.65vw; }
  .qend { width:25%; height:1.65vw; background:var(--r); border-radius:.2vw; margin-left:auto; animation:qglow 1.25s ease-in-out infinite alternate; }
  @keyframes qglow { to { box-shadow:0 0 1.2vw #e0666680; } }
  .flowarrow { font-size:3.4vw; color:var(--accent); animation:arrowin .6s ease-out both; }
  @keyframes arrowin { from { opacity:0; transform:translateX(-1vw); } }
  .q64grid { display:grid; grid-template-columns:repeat(8,1fr); gap:.27vw; width:min(20vw,32vh); }
  .q64grid i { aspect-ratio:1; border-radius:.22vw; background:#f7c9c9; border:1px solid #eda9a9;

  .expl .cur { transition:opacity .25s; } .expl .cur.off { opacity:.15; }

  /* Struggle wall */
  .wall { display:grid; grid-template-columns:repeat(5, 1fr); gap:.7vw; width:100%; }
  .wt { border:2px solid #e1e4ea; border-radius:.8vw; padding:.55em .5em; text-align:left; background:#fff; transition:opacity .25s, background .25s, border-color .25s; }
  .wt b { display:block; font-size:.95vw; color:var(--muted); font-weight:700; }
  .wt span { display:block; font-size:1.15vw; font-weight:600; line-height:1.25; margin-top:.15em; }
  .wt.dim { opacity:.3; }
  .wt.hi { background:#eef3ff; border-color:var(--accent); } .wt.hi b { color:var(--accent); }
  .wt.last { background:var(--accent); border-color:var(--accent); color:#fff; } .wt.last b { color:#cfdcff; }

  /* Stats */
  .stats { display:flex; gap:3.5vw; justify-content:center; }
  .stat { text-align:center; transition:opacity .25s; }
  .stat.off { opacity:.12; }
  .stat .sn { font-size:7vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .stat .sl { font-size:1.4vw; color:var(--muted); font-weight:600; margin-top:.4em; max-width:14vw; }

  /* Scoreboard */
  .board { border-collapse:collapse; font-size:1.55vw; }
  .board th { font-size:1.1vw; color:var(--muted); font-weight:600; text-align:left; padding:.4em 1.2em; }
  .board td { padding:.55em 1.2em; border-top:1px solid #eef0f3; text-align:left; font-weight:600; }
  .board td.n { text-align:center; font-weight:800; }
  .board .bad { color:var(--bad); } .board .good { color:var(--good); }
  .board small { font-weight:500; color:var(--muted); font-size:.75em; }
  .board tr.off { opacity:.12; }

  /* Test examples */
  .exbox .prompt { font-size:1.25vw; max-width:100%; }
  .exbox.big .extag { font-size:1.6vw; } .exbox.big .exrule { font-size:1.25vw; margin-bottom:1.3em; }
  .exbox.big .prompt { font-size:1.85vw; padding:1.3em 1.5em; }
  .exgrid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1.4vw 1.6vw; width:97%; }
  .exgrid .extag { font-size:1vw; margin-bottom:.15em; }
  .exgrid .exrule { font-size:.75vw; margin-bottom:.6em; }
  .exgrid .prompt { font-size:.85vw; line-height:1.45; padding:.7em .9em; }
  .extag { font-size:1.2vw; font-weight:700; color:var(--accent); margin-bottom:.25em; text-transform:uppercase; letter-spacing:.07em; }
  .exrule { font-size:.95vw; color:var(--muted); font-family:ui-monospace,monospace; margin-bottom:1.1em; }
  .ruletag { position:absolute; top:4%; left:4%; font-size:.95vw; color:var(--muted); font-family:ui-monospace,monospace; font-weight:600; }

  /* Prompt boxes */
  .prompt { font-family: ui-monospace, Menlo, monospace; font-size:1.35vw; line-height:1.6; text-align:left;
            background:#f7f8fa; border:1px solid #d8dde3; border-radius:12px; padding:1em 1.3em; max-width:92%;
            white-space:pre-wrap; }
  .needle { background:#fff3b0; font-weight:700; } .q { background:#dbe7ff; font-weight:700; }
  .dim { color:var(--muted); }

  /* Timeline */
  .timeline { display:flex; position:absolute; top:14%; left:8%; right:8%; }
  .hastl { justify-content:flex-start !important; padding-top:30vh; }
  .hastl .say { margin-bottom:.7em; font-size:2.8vw; }
  .hastl .readlist div { font-size:1.45vw; padding:.32em 0; }
  .hastl .readlist span { font-size:.95vw; }
  .k-timeline > img { max-height:36vh; margin-top:20vh; border-radius:10px; }
  .tl { flex:1; border-top:5px solid var(--accent); padding:.7em .6em 0 0; text-align:left; }
  .tl b { display:block; font-size:1.35vw; } .tl span { font-size:1.15vw; color:var(--muted); line-height:1.35; display:block; }
  .tl.off { border-top-color:#dfe3ea; } .tl.off b, .tl.off span { opacity:.3; }
  .tl.on b { color:var(--accent); }
  .tltag { position:absolute; top:6%; left:8%; font-size:1.05vw; font-weight:800; letter-spacing:.18em;
           color:#fff; background:var(--accent); padding:.45em .9em; border-radius:999px; }

  /* Reading list */
  .readlist { column-count:2; column-gap:4vw; text-align:left; width:94%; }
  .readlist div { break-inside:avoid; font-size:1.45vw; font-weight:600; padding:.4em 0; border-bottom:1px solid #eef0f3; }
  .readlist span { display:block; font-size:1.05vw; font-weight:400; color:var(--muted); margin-top:.15em; }
  .ctable { width:94%; border-collapse:collapse; font-size:1.3vw; text-align:left; }
  .ctable th { font-size:1.05vw; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; padding:.5em .6em; border-bottom:2px solid #d5dbe8; }
  .ctable td { padding:.55em .6em; border-bottom:1px solid #e8ecf3; vertical-align:top; line-height:1.35; }
  .ctable td:first-child { font-weight:700; }
  .ctable tr.ours td { background:#eef3fd; }

  /* Matched real-benchmark results */
  .k-results, .k-pilot { align-items:stretch; justify-content:center; text-align:left; padding:4.5% 5%; }
  .bench-title { font-size:clamp(30px, 2.15vw, 42px); font-weight:800; letter-spacing:-.025em; margin:0; }
  .bench-meta { font-size:clamp(14px, 1.02vw, 20px); color:var(--muted); margin:.45em 0 1em; }
  .bench-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:clamp(14px, .91vw, 17.5px); text-align:left; }
  .bench-table th { font-size:clamp(12px, .77vw, 15px); text-transform:uppercase; letter-spacing:.045em; color:var(--muted);
                    font-weight:700; padding:.5em .4em; border-bottom:2px solid #d5dbe8; vertical-align:bottom; }
  .bench-table td { padding:.56em .4em; border-bottom:1px solid #e8ecf3; vertical-align:middle;
                    line-height:1.25; font-variant-numeric:tabular-nums; }
  .bench-table td:first-child { font-weight:700; }
  .bench-table .bench-notes { border:0; padding:.8em .4em 0; color:var(--muted); font-size:clamp(13px, .84vw, 16px); line-height:1.4; font-weight:400; }
  .bench-table .bench-notes strong { color:var(--fg); }
  /* Tail "reads everything" animation */
  .tailwrap { width:88%; }
  .tailwrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .tailwrap .arc { fill:none; stroke:var(--b); stroke-width:5; stroke-linecap:round; opacity:.55;
                   animation:arcin .7s ease both; }
  .tailwrap .cellr { fill:#eef0f3; stroke:#dfe3ea; }
  .tailwrap .cellr.cur { fill:var(--r); stroke:#b0413e; stroke-width:3; }
  @keyframes arcin { from { opacity:0; } to { opacity:.55; } }
  .cmp2 { display:flex; gap:6vw; justify-content:center; align-items:flex-start; }
  .cmpp { display:flex; flex-direction:column; align-items:center; }
  .cmph { font-size:1.7vw; font-weight:800; margin-bottom:.5em; }
  .cmpcv { height:38vh; aspect-ratio:1; display:block; }
  .cvw { position:relative; }
  .tailnote { position:absolute; left:100%; bottom:-.4vh; display:flex; align-items:center; gap:.4vw;
              white-space:nowrap; font-size:1.1vw; color:var(--muted); text-align:left; line-height:1.25; }
  .tailnote b { color:var(--r); }
  .tailnote .br { font-size:3.4vh; color:var(--r); font-weight:300; }
  .cnt { font-size:1.35vw; color:var(--muted); margin-top:.6em; font-variant-numeric:tabular-nums; }
  .cnt b { color:var(--ink, #111); font-size:1.25em; }
  .paircv { width:86%; height:auto; display:block; }
  .cmpwrap { width:88%; }
  .cmpwrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .cmpwrap .arc { fill:none; stroke-width:3.4; stroke-linecap:round; opacity:.5;
                  animation:arcin .55s ease both; }
  .cmpwrap .cellr { fill:#eef0f3; stroke:#dfe3ea; }
  .cmpwrap .cellr.cur { fill:var(--r); stroke:#b0413e; stroke-width:3; }
  .cmpwrap .lab { font-size:21px; font-weight:700; fill:#3a3f4a; }
  .cmpwrap .slab { font-size:15px; fill:#8a93a3; }
  .readlist.todo { column-count:1; width:78%; }
  .readlist.todo div { font-size:2.2vw; padding:.55em 0; } .readlist.todo span { font-size:1.45vw; }

  /* People / partners */
  .ptitle { font-size:3.4vw; font-weight:800; color:var(--accent); margin:0 0 1em; letter-spacing:-.015em; }
  .pgrid { display:flex; gap:3vw; align-items:stretch; justify-content:center; width:100%; }
  .pgrid .p { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .pgrid .pimg { height:17vh; display:flex; align-items:center; justify-content:center; }
  .pgrid .plogo { max-height:17vh; max-width:100%; }
  .slide img.face, .face { width:14vh; height:14vh; border-radius:0; object-fit:cover; object-position:center 30%; max-height:none !important; max-width:14vh; }
  .initial { width:14vh; height:14vh; border-radius:0; background:#e8edfb; color:var(--accent);
             font-size:8vh; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .pgrid .pname { font-size:1.7vw; font-weight:800; margin:.7em 0 0; }
  .pgrid .prole { font-size:1.2vw; font-weight:700; color:var(--accent); margin:.25em 0 0; text-transform:uppercase; letter-spacing:.06em; }
  .pgrid .ptag { margin-top:.9em; display:flex; flex-direction:column; align-items:center; color:var(--muted); font-size:1.1vw; font-weight:600; }
  .pgrid .ptag .curl { font-size:2.4vw; line-height:.5; display:inline-block; transform:rotate(90deg); color:var(--accent); }
  .pgrid .pcap { font-size:1.2vw; color:var(--muted); margin:.4em 0 0; line-height:1.35; }
  .pgrid ul { list-style:none; padding:0; margin:.6em 0 0; }
  .pgrid li { font-size:1.15vw; color:var(--muted); line-height:1.4; margin:.3em 0; }

  /* Bento: everything in one view */
  .bento { position:absolute; inset:5% 3.5%; display:grid; grid-template-columns:repeat(5, 1fr);
           grid-template-rows:repeat(3, 1fr); gap:1vw; }
  .tile { background:#f5f5f7; border-radius:1.4vw; padding:1vw; display:flex; flex-direction:column;
          justify-content:center; align-items:center; text-align:center; overflow:hidden; }
  .tile .tn { font-size:3.4vw; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .tile .tt { font-size:1.1vw; font-weight:600; margin-top:.55em; line-height:1.3; }
  .tile .ts { font-size:.95vw; color:var(--muted); margin-top:.3em; }
  .tile.blue { background:var(--accent); color:#fff; } .tile.blue .ts { color:#d6e0ff; }
  .tile.dark { background:#111418; color:#fff; } .tile.dark .ts { color:#9aa3b2; }
  .tile.center { grid-column:2 / 5; grid-row:1 / 3; background:#fff; border:1px solid #e6e8ec; }
  .tile.center img { max-height:22vh; }
  .tile.center .cn { font-size:4.6vw; font-weight:800; letter-spacing:-.02em; margin-top:.2em; }
  .tile.center .cs { font-size:1.6vw; color:var(--muted); margin-top:.2em; }
  .tile.chart { grid-column:2 / 4; padding:.6vw; background:#fff; border:1px solid #e6e8ec; }
  .tile.chart img { max-height:100%; max-width:100%; }
  .kernelchecks { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:2.5vw;
                  width:90%; align-items:stretch; }
  .kernelcheck { display:flex; flex-direction:column; align-items:center; justify-content:center;
                 gap:1.2vw; padding:2vw 1.5vw; min-height:18vw; background:#f5f7fb;
                 border:2px solid #dfe4ec; border-radius:1vw; text-align:center; }
  .kctitle { font-size:2vw; font-weight:800; color:var(--accent); }
  .kcdesc { font-size:1.3vw; color:var(--muted); line-height:1.4; }
  .kcarrow { font-size:2.5vw; color:var(--accent); line-height:1; }
  .kccompare { display:flex; align-items:center; justify-content:center; gap:.8vw; width:100%; }
  .kccompare span { font-size:1.15vw; font-weight:700; white-space:nowrap; padding:.8vw 1vw;
                    background:#fff; border:2px solid #dfe4ec; border-radius:.5vw; }
  .kccompare b { font-size:2vw; font-weight:800; color:var(--accent); }
  .kcfooter { font-size:1.1vw; color:var(--muted); line-height:1.4; }
</style>

<body>
<div id="deck"></div>
<div class="timer" id="timer"></div>
<div class="pvw" id="pvw"><div class="in" id="pvwin"></div></div>
<div class="footer"><span id="num"></span></div>
<script>
// Each entry is one slide.
//   kind: hero | section | num | photo | img | timeline | readlist | team | partners | bento | results | pilot | (default: one sentence)
//   vis:  a visual that stays fixed in the middle while `say` changes at the bottom (see VIS below)
//   say = the one sentence on screen; sub = optional small line under it.
const F = "../figures/", A = "assets/";
const S = [
  {kind: "hero", corner: true},
  {kind: "hero", say: "An LLM that can scale efficiently to longer context windows.", corner: true},
  {img: A + "utmist_logo.png", kind: "img", say: "A UTMIST research project"},

  {kind: "section", say: '<span class="secnum">PART 1 · Han</span>The problem'},
  {vis: "tokens", step: 0, say: "AI language models read text as small pieces called tokens."},
  {vis: "tokens", step: 1, say: "To understand each token, the model looks back at every token before it."},
  {vis: "attn", say: "This looking-back step is called attention.", sub: "every token's query (Q) is compared with every earlier token's key (K)"},
  {vis: "quad", say: "Watch what happens as the context window grows."},
  {vis: "quad", say: "Double the context window, and attention does four times the work."},
  {kind: "num", num: "8 billion", say: "comparisons for one 128,000-token document", sub: "per attention head, and the model has 1,024 of them"},
  {vis: "expl", say: "That's why long documents are slow and expensive.", sub: "a sparse design should grow subquadratically instead"},

  {kind: "section", say: '<span class="secnum">PART 2 · Derek</span>The idea'},
  {say: "What if each token only looked at what matters?"},
  {vis: "models", say: "That's the idea behind sparse attention.", sub: "only a few tokens matter for understanding any one token"},
  {vis: "models", hl: true, say: "Many faster-attention designs exist. We started from Big Bird."},
  {vis: "bb", step: 1, say: "Big Bird mixes three fixed patterns. First: a few global tokens everyone sees."},
  {vis: "bb", step: 2, say: "Second: the nearby text."},
  {vis: "bb", step: 3, say: "Third: a few random spots."},
  {vis: "bb", step: 4, say: "Together: the same fixed shape, whatever the text says."},
  {vis: "win", step: 1, say: "Big Bird's window takes everything nearby."},
  {vis: "win", step: 2, say: "Bigger Bird chooses where to look, based on what it needs to answer."},

  {kind: "section", say: '<span class="secnum">PART 3 · Jerry</span>Evaluation method'},

  {vis: "prompt", say: ""},
  {say: "We also time how long each model takes to read the document.", sub: "same GPU, same settings, one H100"},

  {kind: "section", say: "<span class='secnum'>PART 4 · Thomas</span>What didn't work"},
  {vis: "wall", step: 0, say: "We tried 19 different architectures."},
  {vis: "wall", step: 1, say: "The first fifteen ran on small models, on small tests."},
  {vis: "wall", step: 2, say: "Then we moved to a modern model and a much harder test."},
  {vis: "stats", step: 1, say: "19 architectures."},
  {vis: "stats", step: 2, say: "Our results folder holds about 1,700 saved runs.", sub: "each file is one benchmark run, timestamped"},
  {vis: "stats", step: 3, say: "And over 400 code commits along the way."},
  {say: "For months, every fully sparse version failed on long documents."},
  {say: "They worked at 65,000 tokens.", sub: "about a 200-page book"},
  {say: "They broke at 128,000 tokens.", sub: "about 400 pages: the most this model can read"},
  {vis: "board", step: 1, say: "Every fully sparse version scored 0 or 1 out of 6 at 128,000 tokens."},

  {kind: "section", say: '<span class="secnum">PART 5 · Thomas</span>Our fix'},
  {vis: "docmap", say: "Start with a long prompt.", sub: "Text becomes a sequence of token positions."},
  {vis: "query64", say: "Step 1 · Take the final 64 query positions.", sub: "One 8 × 8 group · used separately in each layer and attention head."},
  {vis: "scoremap", say: "Step 2 · Each query scores keys in its causal past.", sub: "Q·K → softmax over prior keys · heatmap shows 16 sample keys, not the whole context."},
  {vis: "mean64", say: "Step 3 · Average each key's score across the 64 queries.", sub: "This gives one salience score per earlier key, for this head and layer."},
  {vis: "rankflow", say: "One head turns those 64 query rows into one ranked key list.", sub: "Average each key's softmax probability across the 64 rows, then keep the top 512 eligible positions."},
  {vis: "top512", say: "Step 4 · Each attention head keeps up to 512 ranked tokens.", sub: "Each head has its own selected-position list in every layer."},
  {vis: "heads", say: "Each attention head can focus on different positions.", sub: "Each head gets its own ranked list; the sketches are schematic."},
  {vis: "multiroute", say: "The same 64 query positions create a route list for every head in every layer.", sub: "Each layer/head scores with its own Q/K vectors; heads run in parallel, then their outputs combine before the next layer."},
  {vis: "budget", say: "Now assemble the support for an ordinary query row.", sub: "Three fixed components: 64 sink · 16,384 local · up to 512 routed keys."},
  {vis: "sink64", say: "Sink · keep the first 64 positions available globally.", sub: "An 8 × 8 tile group · fixed at the start of the prompt."},
  {vis: "window16k", say: "Local · keep up to 16,384 recent causal positions.", sub: "Each small tile groups 16 token positions · the window ends at the current query."},
  {vis: "union3", say: "The kernel joins the three sets, then runs one softmax.", sub: "At long context, support is at most 16,960 keys per head · overlaps can make it smaller."},
  {vis: "tail256", say: "Exact tail · the final 256 query rows read their full causal past.", sub: "A 16 × 16 group of query rows · earlier-layer K/V states still reflect sparse attention."},
  {vis: "prefixroute", say: "The route uses the prompt's final 64 queries.", sub: "It can change when more tokens arrive, so this is not prefix-invariant streaming attention."},
  {vis: "bound", say: "With fixed budgets, attention-score work is linear in context length.", sub: "At 131,072 tokens: dense ≈8.59B pairs · Bigger Bird ≤2.26B per head/layer; not an accuracy guarantee."},
  // GPU kernel slides: skeleton only, content TODO. Code: kernels/bigger_bird_flash.py (called from modal_rd/attention.py).
  {kind: "section", say: '<span class="secnum">PART 6 · TBD</span>The GPU kernel'},
  {vis: "kgrid", step: 0, say: "FlashAttention: Computes exact attention without writing the full matrix to memory.", sub: "for causal attention, each query attends to itself and earlier keys. FlashAttention avoids materializing the full attention matrix, but still has quadratic arithmetic complexity."},
  {vis: "kgrid", step: 1, say: "Bigger Bird attends to nearby and selected distant keys.", sub: "Each query attends to the first 64 tokens, up to 16K recent tokens, and 512 routed positions. The final 256 queries instead use full causal attention."},
  {vis: "kgrid", step: 2, say: "Why not just apply a mask to dense attention?", sub: "A naive masked implementation still computes the full score matrix. Bigger Bird's kernel skips unselected key positions entirely, avoiding unnecessary computation and large intermediate tensors."},
  {vis: "gather", say: "Gathering copies the keys each token reads,<br>so the same keys get stored again and again.", sub: "if every token gets its own copy, at 127K: 0.26 GB of K becomes ~530 GB"},
  {vis: "inplace", say: "The kernel reads keys where they already are,<br>so nothing gets copied.", sub: "32 query heads also share 8 sets of K/V, again without copies"},
  {vis: "softmax", say: "One kernel reads all three kinds of keys,<br>and compares them in a single softmax.", sub: "drawn small, scores are an example · in one softmax, high-scoring keys win over the rest"},                   // _attention: front loop, window loop, routed loop
  {vis: "tiles", say: "Triton kernels divides attention into tiles that execute in parallel on the GPU.", sub: "one Triton program = 64 queries in one head · at 127K: about 63,500 programs"},           // grid = (cdiv(T, block_m), BH), BM = BN = 64
  {vis: "online", say: "Online softmax: add each batch to a running total,<br>then throw its scores away.", sub: "only these three values are kept per token · scores are an example"},               // _step: running max / denom / acc, exp2
  {vis: "tail2", say: "The last 256 tokens use the same kernel:<br>just stretch the window over the whole document.", sub: "same code, three settings changed · at 131K: 11.7 ms vs 100 ms for masked SDPA"},                              // attention.py: window=n, front=0 for the last r queries
  {vis: "recompile", say: "New prompt lengths don't trigger a recompile:<br>the kernel takes the length at run time.", sub: "output stayed bit-identical, speed within ±5% · changing the budget still compiles"},                       // N, T, WINDOW, strides are runtime args (exp 20)
  
  {
    vis: "kernelcheck",
    say: "Our Triton kernel matches exact attention over the same keys.",
    sub: "Full causal coverage vs dense SDPA; sparse coverage vs an independent masked reference. BF16 maximum-error tolerance: 0.02."
  },
  {
    vis: "img",
    img: F + "attn_bench.png",
    say: "Sparse attention gets faster as context grows.",
    sub: "H100 · BF16 · per-layer attention including routing and exact tail · 1.88× at 131K, 17.76× at 1M · synthetic Q/K/V"
  },
                                                     // e.g. figures/attn_bench.png

  {kind: "section", say: '<span class="secnum">PART 7 · Jerry</span>Results'},
  {kind: "num", num: "30 / 30", rule: "RULER · niah_single_1 · 30 docs @128K", say: "correct on 128,000-token documents"},
  {kind: "num", num: "28 / 30", rule: "RULER · niah_single_1 · 30 docs @128K", say: "for the normal model", sub: "same documents; that 2-question gap is too small to count as a win"},
  {kind: "num", num: "1.9×", rule: "prefill benchmark · one H100", say: "faster to read the document"},
  {vis: "img", img: F + "scaling.png", say: "The longer the document, the bigger the speed gap.", rule: "benchmark · prefill, one H100", sub: "normal model: double the length → ~3× the time · Bigger Bird: double → ~2×"},
  {vis: "img", img: F + "loglog.png", say: "That's linear growth, not quadratic.", rule: "benchmark · prefill, one H100", sub: "measured slope 1.01 for Bigger Bird vs 1.65 for the normal model"},
  {vis: "img", img: F + "depth.png", say: "It works wherever the fact is hidden.", rule: "RULER · niah_single_1 · needle-depth sweep"},
  {kind: "results", say: "Matched real-benchmark results"},
  {kind: "pilot", say: "LongCodeQA 1M pilot · 6 of 50"},

  {kind: "section", say: '<span class="secnum">PART 8 · Jerry</span>Harder tests'},

  tiles: () => {
    const R = 16, C = 19, ROUTED = [3, 5, 7];
    const keysOf = r => { const w = 8 + (r >> 1); return [0, 1, ...ROUTED, w, w + 1, w + 2, w + 3]; };
    const kind = (r, c) => { const i = keysOf(r).indexOf(c); return i < 0 ? "" : i < 2 ? "g" : i < 5 ? "p" : "b"; };
    const src = Array.from({length: R * C}, (_, j) => `<i class="${kind(Math.floor(j / C), j % C)}"></i>`).join("");
    const slots = [0, 1, 2, 3].map(k => {
      const cellsK = [0, 1, 2, 3].map(rr => keysOf(k * 4 + rr).map((c, i) =>
        `<i class="${kind(k * 4 + rr, c)}" style="--k:${k};--dr:${k * 4};--dc:${c - i - 5}"></i>`).join("")).join("");
      return `<div class="tgslot"><div class="grid tg2">${cellsK}</div><div class="tglab2">program ${k + 1}</div></div>`;
    }).join("");
    return `<div class="tgw2"><div class="grid tg2 tgsrc">${src}</div><div class="tgslots">${slots}</div></div>`;

  online: () => {
    const BATCH = [[1, 2], [0, 3], [5, 1], [2, 4]], COL = ["g", "b", "p", "o"], T = b => .4 + b * 1.7, LAND = .5;
    // Real online softmax over the example scores; every number on the slide comes from here.
    let max = -Infinity, denom = 0, acc = [];
    const states = BATCH.map((scores, b) => {
      const nm = Math.max(max, ...scores), a = Math.exp(max - nm) || 0;
      denom *= a; acc = acc.map(w => [w[0] * a, w[1]]);
      scores.forEach(s => { const p = Math.exp(s - nm); denom += p; acc.push([p, COL[b]]); });
      max = nm;
      return {max, denom, bar: acc.map(w => [w[0] / denom, w[1]])};
    });
    const stack = (vals, cls) => `<div class="osv ${cls}"><b style="--on:0s;--to:${T(0) + LAND}s" class="off">${cls ? "" : "–"}</b>` + vals.map((v, k) =>
      `<b style="--on:${T(k) + LAND}s;--to:${T(k + 1) + LAND}s" class="${k === vals.length - 1 ? "last" : "mid"}">${v}</b>`).join("") + `</div>`;
    // One bar: each key's segment eases to its new share, so older segments slide left as new ones enter from the right.
    const END = T(BATCH.length) + 1, SLIDE = .6, last = states[states.length - 1].bar, pct = s => (s / END * 100).toFixed(2);
    const frames = last.map((_, j) => {
      let w = 0, kf = "0% { width:0%; } ";
      states.forEach((s, k) => {
        const on = T(k) + LAND, nw = (s.bar[j] ? s.bar[j][0] : 0) * 100;
        kf += `${pct(on)}% { width:${w}%; } ${pct(on + SLIDE)}% { width:${nw}%; } `;
        w = nw;
      });
      return `@keyframes osseg${j} { ${kf}100% { width:${w}%; } }`;
    }).join(" ");
    const segs = last.map(([, c], j) => {
      const labels = states.map((s, k) => {
        const f = s.bar[j] ? s.bar[j][0] : 0;
        if (f < .07) return "";
        const off = k + 1 < states.length;
        return `<b class="${off ? "mid" : "last"}" style="--on:${T(k) + LAND + SLIDE / 2}s;--to:${T(k + 1) + LAND}s">${(f * 100).toFixed(0)}%</b>`;
      }).join("");
      return `<i style="background:var(--${c});animation:osseg${j} ${END}s ease-in-out both">${labels}</i>`;
    }).join("");
    const key = (c, n, x, t) => `<i class="osk" style="background:var(--${c});--x:${x}vw;--t:${t}s">${n}</i>`;
    const batches = BATCH.map((scores, b) => `<div class="osb"><span class="osl" style="--t:${T(b)}s">batch ${b + 1}</span><div>${scores.map((n, j) =>
      key(COL[b], n, -((b - 1.5) * 9 + (j ? 1.8 : -1.8)), T(b))).join("")}</div></div>`).join("");
    return `<div class="os"><div class="osbatches">${batches}</div>
      <div class="osbox"><div class="osf"><span>biggest score</span>${stack(states.map(s => s.max), "")}</div>
        <div class="osf"><span>running total</span>${stack(states.map(s => s.denom.toFixed(2)), "")}</div>
        <div class="osf"><span>running mix ÷ total</span><div class="osv wide"><style>${frames}</style><div class="osbar">${segs}</div></div></div></div>
      <div class="osout">same answer as one big softmax, and no score table</div></div>`;
  },
  tail2: () => {
    const N = 24, cur = 22, G = [0, 1, 2], P = [6, 11], B = [16, 17, 18, 19, 20, 21];
    const row = stretch => Array.from({length: N}, (_, j) => {

    const swap = f => `<div class="osv">${LEN.map((l, i) => {
      const last = i === LEN.length - 1;
      return `<b class="${last ? "last" : "mid"}" style="--on:${i * STEP + START}s;--to:${(i + 1) * STEP + START}s">${fmt(f(l))}</b>`;

    const field = (lab, v) => `<div class="osf"><span>${lab}</span>${v}</div>`;

        <div class="osbox">${field("T, queries", `<div class="osv"><b>${TAIL}</b></div>`)}${field("OFFSET", swap(l => l - TAIL))}${field("WINDOW", swap(l => l))}</div></div></div>`;

  softmax: () => {
    const N = 24, cur = 22, G = [0, 1, 2], B = [16, 17, 18, 19, 20, 21], P = [6, 11];

    const row = cells(N, j => j === cur ? "r cur" : G.includes(j) ? "g" : B.includes(j) ? "b" : P.includes(j) ? "p" : "");

  expl: s => {
    const W = 900, H = 400, pad = 70, N = 1048576;
    const x = n => pad + (n / N) * (W - pad - 20), y = v => H - pad - (v / 550e9) * (H - pad - 30);
    const quad = [], lin = [];
    for (let n = 8192; n <= N; n *= Math.SQRT2) { quad.push(`${x(n)},${y(n * n / 2)}`); lin.push(`${x(n)},${y(n * 16960)}`); }
    quad.push(`${x(N)},${y(N * N / 2)}`); lin.push(`${x(N)},${y(N * 16960)}`);
    const ticks = [32768, 131072, 262144, 524288, 1048576].map(n =>
      `<text x="${x(n)}" y="${H - pad + 26}" font-size="17" fill="#8a93a3" text-anchor="middle">${n >= 1e6 ? "1M" : n / 1024 + "K"}</text>` +
      `<line x1="${x(n)}" y1="${H - pad + 4}" x2="${x(n)}" y2="${H - pad}" stroke="#c9ced6"/>`).join("");
    const here = `<line x1="${x(131072)}" y1="${y(8.6e9)}" x2="${x(131072)}" y2="${H - pad}" stroke="#c9ced6" stroke-dasharray="4"/>` +
      `<circle cx="${x(131072)}" cy="${y(8.6e9)}" r="6" fill="#e4572e"/>` +

  scoremap: () => {
    const heat = Array.from({length:64*16},(_,j)=>{

  mean64: () => {
    const heights=[30,46,40,68,38,52,83,43,61,34,75,49,92,40,58,72];
    return `<div class="meanviz"><div class="meanleft"><div class="mini64">${Array.from({length:64},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div><div class="scorehint">64 query rows</div></div>
      <div class="meanarrow">→ &nbsp; mean</div><div class="scorepanel"><div class="scorehead">one score per key</div><div class="meanbars">${heights.map((h,j)=>`<i class="${[6,12,15].includes(j)?"best":""}" style="--h:${h}%;--n:${j}"></i>`).join("")}</div>
        <div class="meanlegend"><span>16 example key positions</span><b style="color:#6e50a7">highest scores → route</b></div><div class="scorehint">Illustrative profile · real scores come from the model.</div></div></div>`;
  },
  rankflow: () => {
    // A toy 32-key softmax makes the aggregation legible; only 8 key columns are drawn.
    // The deck labels every value as schematic, so this is not mistaken for a model trace.
    const shown = [0, 1, 2, 3, 4, 5, 10, 31];
    const labels = ["K₁", "K₂", "K₃", "K₄", "K₅", "K₆", "…", "Kₙ"];
    const bias = [1.05, .55, 1.45, .38, .72, .24, .15, .31, .1, .18, .9, .2, .12, .3, .08, .22,
      .16, .28, .11, .2, .34, .07, .13, .25, .19, .09, .21, .14, .3, .1, .18, .4];
    const rows = Array.from({length:64}, (_, q) => {
      const logits = bias.map((b, k) => b + (k === ((q * 7) % 32) ? 1.35 : 0) + .16 * Math.sin((q + 1) * (k + 3)));
      const exps = logits.map(x => Math.exp(x - Math.max(...logits)));
      const denom = exps.reduce((a, b) => a + b, 0);
      return exps.map(x => x / denom);
    });
    const means = shown.map(k => rows.reduce((sum, row) => sum + row[k], 0) / rows.length);
    const peak = Math.max(...means);
    const topShown = new Set(means.map((x, i) => [x, i]).sort((a, b) => b[0] - a[0]).slice(0, 2).map(x => x[1]));
    const heat = rows.map((row, r) => {
      const values = shown.map(k => row[k]);
      const max = Math.max(...values);
      return values.map((v, c) => `<i class="rfheat ${v >= max * .82 ? "h3" : v >= max * .58 ? "h2" : v >= max * .34 ? "h1" : ""}" style="--r:${r}"></i>`).join("");
    }).join("");
    const bars = means.map((m, i) => `<i class="rfmeanbar ${topShown.has(i) ? "best" : ""}" style="--h:${Math.max(13, m / peak * 96)}%;--n:${i}" title="${labels[i]}"></i>`).join("");
    const keyLabels = labels.map(k => `<span>${k}</span>`).join("");
    return `<div class="rankflow">
      <div class="rfcard"><div class="rflabel">Probe queries</div><div class="rfquerygrid">${Array.from({length:64},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div>
        <div class="rfqcount">64</div><div class="rfsmall">final query positions<br>one probe per row</div></div>
      <div class="rfcard rfmatrixcard"><div class="rfmatrixhead"><b>One layer · one head</b><span>Each row is that query’s softmax over earlier keys</span></div>
        <div class="rfkeylabels">${labels.map(k=>`<span>${k}</span>`).join("")}</div><div class="rfmatrix">${heat}</div>
        <div class="rfmatrixfoot">Illustrative pattern · sample columns shown · real run scores every eligible key</div></div>
      <div class="rfcard rfavgcard"><div class="rflabel">Pool each key</div><div class="rfavgtitle">Average down<br>the 64 query rows</div>
        <div class="rfmeanbars">${bars}</div><div class="rfkeys">${keyLabels}</div><div class="rfranknote">Rank by mean score</div></div>
      <div class="rfcard"><div class="rflabel">Keep highest-ranked keys</div><div class="rftopgrid">${Array.from({length:512},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div>
        <div class="rfoutcount">up to 512</div><div class="rfoutnote">eligible key positions<br>for this head + layer</div></div>
      <div class="rffoot">The 64 are probes, not candidate keys. Each head's query vectors produce its own scores; the same pooling repeats independently at every layer.</div>
    </div>`;
  },
  top512: () => {
    const picks=new Set([2,5,8,12,17,21,26,31,36,42,47]);
    const src=Array.from({length:48},(_,j)=>`<i class="${picks.has(j)?"routed":""}" style="--n:${j}"></i>`).join("");
    return `<div class="routepanel"><div class="scorepanel"><div class="flowtitle">Scattered positions across the text</div><div class="docline">${src}</div><div class="doclabels"><span>start</span><span>middle</span><span>end</span></div></div>
      <div class="flowarrow">→</div><div class="scorepanel"><div class="routegrid512">${Array.from({length:512},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div>
        <div class="routecount">512<small>individual token positions · one head</small></div><div class="qsmall">Source strip is schematic; tray shows all 512.</div></div></div>`;
  },
  heads: () => {
    const picks=[[2,7,16,27,34],[4,11,18,24,39],[1,13,20,31,42]];
    return `<div class="headrow">${picks.map((ps,j)=>`<div class="headcard"><div class="headlabel">Attention head ${j+1}</div><div class="headstrip">${Array.from({length:48},(_,k)=>`<i class="${ps.includes(k)?"pick":""}" style="--n:${k%7}"></i>`).join("")}</div>
      <div class="headsmall">own ranked list · up to 512 positions</div></div>`).join("")}</div><div class="qsmall">Three schematic heads · not measured route traces.</div>`;
  },
  multiroute: () => {
    const heads = [
      {label:"Head 1", color:"#8b6fbd", offset:1},
      {label:"Head 2", color:"#4f8fc8", offset:5},
      {label:"Head 32", color:"#36a27b", offset:9},
    ];
    const layers = [
      {label:"L1", offset:0},
      {label:"L2", offset:3},
      {gap:true},
      {label:"L32", offset:11},
    ];
    const routeStrip = (layer, head) => {
      const marks = new Set(Array.from({length:6}, (_,i) => (i*3 + head.offset + layer.offset*2) % 20));
      return `<div class="mwcell" style="--head-color:${head.color}"><div class="mwstrip">${Array.from({length:20},(_,i)=>`<i class="${marks.has(i)?"pick":""}"></i>`).join("")}</div></div>`;
    };
    const table = `<div class="mwtable"><div></div>${heads.map(h=>`<div class="mwtablehead">${h.label}<small>own ≤512 route keys</small></div>`).join("")}`+
      layers.map(layer=>layer.gap
        ? `<div class="mwlayer">…</div><div class="mwgap">more layers; each makes fresh lists</div>`
        : `<div class="mwlayer">${layer.label}</div>${heads.map(h=>routeStrip(layer,h)).join("")}`
      ).join("") + `</div>`;
    return `<div class="multiwork">
      <div class="mwsource"><div class="mwtag">Shared query positions</div><div class="mwqgrid">${Array.from({length:64},()=>`<i></i>`).join("")}</div>
        <div class="mwqcount">64 rows</div><div class="mwqnote">The final 64 prompt positions, reused as query positions at every layer.</div><div class="mwfan">fan out →</div></div>
      <div class="mwcenter"><div class="mwalg">For each layer × head: mean each key's softmax probability across 64 query rows → keep up to 512 keys.</div>${table}
        <div class="mwroutefoot">Example routes are schematic. Each head and layer gets a different ranked list.</div></div>
      <div class="mwside"><div class="mwtitle">ONE ORDINARY QUERY ROW</div><div class="mwcomponents">
        <div class="mwcomponent sink">Shared prefix · 64</div><div class="mwcomponent local">Recent window · 16,384</div><div class="mwcomponent route">This head's route · ≤512</div></div>
        <div class="mwsoft">Unique union → one softmax</div><div class="mwcausal">Causal mask hides later keys from this row.</div>
        <div class="mwoutputs">Head outputs concatenate → next layer repeats with new Q/K scores.</div></div>
      <div class="mwexception">Tail exception: the final 256 query rows use full causal attention.</div>
    </div>`;
  },
  budget: () => `<div class="budgetcards">
    <div class="budgetcard sink"><div class="budgetnum">64</div><div class="tile64">${Array.from({length:64},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div><div class="budgetname">global sink positions</div></div>
    <div class="budgetcard local"><div class="budgetnum">16,384</div><div class="windowgroups">${Array.from({length:1024},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div><div class="wincaption">1,024 tiles × 16 positions each</div><div class="budgetname">recent local positions</div></div>
    <div class="budgetcard route"><div class="budgetnum">≤ 512</div><div class="tile512">${Array.from({length:512},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div><div class="budgetname">routed middle positions · per head</div></div>
    </div>`,
  sink64: () => `<div class="routepanel"><div class="scorepanel"><div class="tile64">${Array.from({length:64},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div><div class="routecount" style="color:#508c48">64<small>prefix positions</small></div></div>
    <div class="flowarrow">→</div><div class="scorepanel"><div class="flowtitle">Visible to later query rows</div><div class="docline">${Array.from({length:56},(_,j)=>`<i class="${j<5?"sink":""}"></i>`).join("")}</div>
      <div class="doclabels"><span>shared beginning</span><span>… long document …</span><span>current query</span></div></div></div>`,
  window16k: () => `<div class="flowviz"><div class="windowgroups">${Array.from({length:1024},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div>
    <div class="routecount" style="color:#4779c7">16,384<small>local token positions · 1,024 groups × 16 tokens</small></div>
    <div class="docline">${Array.from({length:48},(_,j)=>`<i class="${j>=34&&j<47?"window":""}${j===47?" query":""}"></i>`).join("")}</div>
    <div class="doclabels"><span>older context</span><span>exact recent window</span><span>query</span></div></div>`,
  union3: () => `<div class="fusion"><div class="fusionin">
    <div class="fusionrow"><b>64</b><i class="fusionbar g" style="--w:7vw;--delay:.1s"></i><span>sink</span></div>
    <div class="fusionrow"><b>16,384</b><i class="fusionbar b" style="--w:18vw;--delay:.25s"></i><span>local</span></div>
    <div class="fusionrow"><b>≤ 512</b><i class="fusionbar p" style="--w:10vw;--delay:.4s"></i><span>routed</span></div>
    <div class="scorehint">Set sizes are shown as labels; bars are not to scale.</div></div>
    <div class="flowarrow">→</div><div class="softbox"><div class="softlabel">key union</div><strong>one softmax</strong><div class="scorehint">duplicates removed · future keys masked</div></div></div>`,
  tail256: () => `<div class="tail256viz"><div class="flowtitle">Schematic prompt tail · not to scale</div>
    <div class="tailtimeline">${Array.from({length:56},(_,j)=>`<i class="${j>=48?"full":""}" style="--n:${j}"></i>`).join("")}</div>
    <div class="tailray"></div><div class="tailmatrix">${Array.from({length:256},(_,j)=>`<i style="--n:${j}"></i>`).join("")}</div>
    <div class="routecount" style="color:var(--r)">256<small>query rows in the exact dense tail · 16 × 16</small></div></div>`,
  prefixroute: () => {
    const strip=(n,q,marks)=>Array.from({length:n},(_,j)=>`<i class="${j>=n-q?"query":marks.includes(j)?"routed":""}" style="--n:${j}"></i>`).join("");
    return `<div class="flowviz"><div class="headcard" style="width:100%"><div class="headlabel">Shorter prompt prefix</div><div class="docline">${strip(40,6,[8,15,25])}</div><div class="doclabels"><span>same beginning</span><span>last 64 queries sit here</span></div></div>
      <div class="flowarrow">↓ more tokens arrive</div><div class="headcard" style="width:100%"><div class="headlabel">Completed prompt</div><div class="docline">${strip(52,7,[8,15,25,35,43])}</div><div class="doclabels"><span>same beginning</span><span>new end → new routing queries</span></div></div>
      <div class="qsmall">Schematic: changing the prompt end can change the globally selected routes.</div></div>`;
  },
  bound: () => `<div class="boundviz"><div class="boundrow"><label>Dense · N(N+1)/2</label><div class="boundbar"><i style="--w:100%;--delay:.1s"></i></div><b>8.59B</b></div>
    <div class="boundrow"><label>BB · fixed support + scans</label><div class="boundbar"><i class="sparse" style="--w:26.3%;--delay:.35s"></i></div><b>≤2.26B</b></div>
    <div class="boundformula">N × (64 + 16,384 + 512 + 64 + 256)</div>
    <div class="boundnote">N = 131,072 → ≤2.26B score pairs/head/layer.</div>
    <div class="boundnote">Attention-score pair upper bound · excludes top-k, MLP, memory traffic, and other runtime.</div></div>`,
};

const deck = document.getElementById("deck");

  } else if (s.kind === "results") {
    html += `<h2 class="bench-title">${s.say}</h2>` +
      `<p class="bench-meta">R1-Distill-Llama-8B · BF16 · H100 · 1,178 paired benchmark prompts</p>` +
      `<table class="bench-table"><colgroup><col style="width:20%"><col style="width:22%"><col style="width:13%"><col style="width:12%"><col style="width:16%"><col style="width:17%"></colgroup>` +
      `<thead><tr>${MATCHED_RESULTS[0].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
      MATCHED_RESULTS.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") +

      `</tbody></table>`;
  } else if (s.kind === "pilot") {
    html += `<h2 class="bench-title">${s.say}</h2>` +
      `<p class="bench-meta">Nemotron-UltraLong-8B · BF16 · same H100 · no KV cache or decode</p>` +

      `<thead><tr>${LCQA_1M_PILOT[0].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
      LCQA_1M_PILOT.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") +
      `<tr><td class="bench-notes" colspan="4"><strong>Pilot only.</strong> Six of 50 official prompts; the full matched 50-example run is still in progress. This is one full-prompt forward scored on the next answer letter, not generated-answer quality or decode performance. The final query is available to routing, so this does not test prefix-invariant streaming inference.</td></tr>` +

              TODO.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
    if (s.kind === "readlist")
      html += `<p class="say" style="margin:0 0 .9em">${s.say}</p><div class="readlist">` +
              READLIST.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
    if (s.kind === "team")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + TEAM.map(p =>
        `<div class="p"><div class="pimg">${face(p, "face")}</div><p class="pname">${p.name}</p><p class="prole">${p.role}</p>` +
        `<ul>${p.pts.map(t => `<li>${t}</li>`).join("")}</ul>` +
        `${p.tag ? `<div class="ptag"><span class="curl">}</span>${p.tag}</div>` : ""}</div>`).join("") + `</div>`;
    if (s.kind === "partners")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + PARTNERS.map(p =>
        `<div class="p"><div class="pimg">${face(p, p.round || p.initial ? "face" : "plogo")}</div>` +
        `${p.name ? `<p class="pname">${p.name}</p>` : ""}<p class="pcap">${p.cap}</p></div>`).join("") + `</div>`;
    if (s.img && !["partners", "team"].includes(s.kind)) html += `<img src="${s.img}" alt="">`;
    if (s.kind === "num") html += `<div class="num">${s.num}</div>`;
    if (s.say && !["readlist", "todo", "ctable", "team", "partners", "results"].includes(s.kind)) html += `<p class="say">${s.say}</p>`;
    if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  }
  el.innerHTML = html;
  deck.appendChild(el);
});

// Growth animation: n tokens double each cycle; the triangle of comparisons fills in.
document.querySelectorAll(".quadcv").forEach(cv => {
  const lab = cv.parentElement.querySelector(".quadlab"), ctx = cv.getContext("2d");
  const seq = [8, 16, 32, 64, 128];
  function draw() {
    const t = performance.now() / 2400;
    const n = seq[Math.floor(t) % seq.length];
    const lim = Math.ceil(Math.min(1, (t % 1) * 2.2) * n * (n + 1) / 2);
    const size = 430, mx = (660 - size) / 2, my = 18, cs = size / n;
    ctx.clearRect(0, 0, 660, 480);
    ctx.fillStyle = "#1f4fd8";
    let drawn = 0;
    for (let r = 0; r < n && drawn < lim; r++)
      for (let c = 0; c <= r && drawn < lim; c++, drawn++)
        ctx.fillRect(mx + c * cs, my + r * cs, Math.max(1, cs - 0.6), Math.max(1, cs - 0.6));
    lab.innerHTML = `<b>${n}</b> tokens → <b>${(n * (n + 1) / 2).toLocaleString()}</b> comparisons`;
    requestAnimationFrame(draw);
  }
  draw();
});

// Dense vs Bigger Bird: attention grids fill row by row (one row = one token's reads), with live counters.
const CMP_N = 48, CMP_ROUTED = [7, 14, 21, 28, 35], CMP_TAIL = 4, CMP_WIN = 8;
const cmpCell = (k, r, c) => {
  if (c > r) return null;
  if (k === "dense") return "#1f4fd8";
  if (r >= CMP_N - CMP_TAIL) return c === r ? "#e06666" : "#f7c9c9";
  if (c < 2) return "#a8d5a2";
  if (r - c < CMP_WIN) return "#a9c4f5";
  if (CMP_ROUTED.includes(c)) return "#b9a6dc";
  return null;
};
const cmpRowOps = (k, r) => { let n = 0; for (let c = 0; c <= r; c++) if (cmpCell(k, r, c)) n++; return n; };
document.querySelectorAll(".cmpcv").forEach(cv => {
  const k = cv.dataset.k, ctx = cv.getContext("2d"), cn = cv.closest(".cmpp").querySelector(".cn");
  const slide = cv.closest(".slide"), S0 = 440, cs = S0 / CMP_N, DUR = 3600, HOLD = 2600;
  function draw() {
    requestAnimationFrame(draw);
    if (!slide.classList.contains("active")) return;
    const t = (performance.now() - (slide._t0 || 0)) % (DUR + HOLD);
    const rows = Math.min(CMP_N, Math.floor(t / DUR * CMP_N) + 1);
    ctx.clearRect(0, 0, S0, S0);
    ctx.fillStyle = "#f1f3f7";
    for (let r = 0; r < CMP_N; r++) for (let c = 0; c <= r; c++) ctx.fillRect(c * cs, r * cs, cs - .8, cs - .8);
    let ops = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c <= r; c++) {
      const col = cmpCell(k, r, c);
      if (col) { ctx.fillStyle = col; ctx.fillRect(c * cs, r * cs, cs - .8, cs - .8); ops++; }
    }
    if (rows < CMP_N) { ctx.fillStyle = "#e06666"; ctx.fillRect(0, (rows - 1) * cs, 3, cs - .8); }
    cn.textContent = ops.toLocaleString();
  }
  draw();
});

// Pairwise view: step through tokens one at a time; the current token draws arcs to everything it reads.
const PR_N = 24, PR_ROUTED = [6, 12, 17], PR_TAIL = 2, PR_WIN = 3;
const prTargets = (k, j) => {
  const out = [];
  for (let i = 0; i < j; i++) {
    if (k === "dense") { out.push([i, "#1f4fd8"]); continue; }
    if (j >= PR_N - PR_TAIL) out.push([i, "#e06666"]);
    else if (i < 2) out.push([i, "#7cc174"]);
    else if (j - i <= PR_WIN) out.push([i, "#6f9cf0"]);
    else if (PR_ROUTED.includes(i)) out.push([i, "#9b82d0"]);
  }
  return out;
};
document.querySelectorAll(".paircv").forEach(cv => {
  const ctx = cv.getContext("2d"), slide = cv.closest(".slide"), W = 1200, pad = 230, cw = (W - pad - 30) / PR_N;
  const STEP = 200, HOLD = 1800, cx = i => pad + i * cw + cw / 2;
  const cumT = [0];
  for (let j = 0; j < PR_N; j++) cumT.push(cumT[j] + STEP * (j >= PR_N - 3 ? 3.5 : 1));
  const TOTAL = cumT[PR_N];
  const arc = (y, j, i, col, a, lw) => {
    const h = Math.min(120, (cx(j) - cx(i)) * .32 + 14);
    ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx(j), y - 4); ctx.quadraticCurveTo((cx(i) + cx(j)) / 2, y - h, cx(i), y - 4); ctx.stroke();
  };
  const row = (y, k, name, cur) => {
    let ops = 0;
    for (let j = 1; j < cur; j++) { const t = prTargets(k, j); ops += t.length; t.forEach(([i, col]) => arc(y, j, i, col, .07, 2)); }
    const tg = cur < PR_N ? prTargets(k, cur) : [];
    tg.forEach(([i, col]) => arc(y, cur, i, col, .9, 3.2));
    ops += tg.length;
    ctx.globalAlpha = 1;
    for (let i = 0; i < PR_N; i++) {
      const hit = tg.find(t => t[0] === i);
      ctx.fillStyle = i === cur ? "#e06666" : hit ? hit[1] : i < cur ? "#dfe3ea" : "#f1f3f7";
      ctx.beginPath(); ctx.roundRect(cx(i) - cw / 2 + 3, y, cw - 6, 34, 6); ctx.fill();
    }
    ctx.fillStyle = "#14171f"; ctx.font = "800 26px Inter, Helvetica, sans-serif"; ctx.fillText(name, 10, y - 8);
    ctx.font = "800 30px Inter, Helvetica, sans-serif"; ctx.fillText(ops.toLocaleString(), 10, y + 30);
    const w = ctx.measureText(ops.toLocaleString()).width;
    ctx.fillStyle = "#8a93a3"; ctx.font = "500 18px Inter, Helvetica, sans-serif"; ctx.fillText("comparisons", 18 + w, y + 30);
  };
  function draw() {
    requestAnimationFrame(draw);
    if (!slide.classList.contains("active")) return;
    const t = (performance.now() - (slide._t0 || 0)) % (TOTAL + HOLD);
    let cur = PR_N; while (cur > 0 && t < cumT[cur - 1]) cur--;
    cur = Math.max(1, Math.min(PR_N, cur));
    ctx.clearRect(0, 0, W, 460);
    row(185, "dense", "Dense", cur);
    row(415, "bb", "Bigger Bird", cur);
  }
  draw();
});

const mainCount = S.findIndex(s => s.kind === "section" && s.say === "Appendix");
const slides = [...document.querySelectorAll(".slide")];
let i = Math.max(0, Math.min(slides.length - 1, parseInt(location.hash.slice(1) || "1") - 1));
const pvw = document.getElementById("pvw"), pvwin = document.getElementById("pvwin"), timerEl = document.getElementById("timer");
let t0 = null;
setInterval(() => {
  if (t0 === null) return;
  const s = Math.floor((Date.now() - t0) / 1000);
  timerEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}, 500);
const show = () => {
  slides.forEach((s, j) => { if (j === i && !s.classList.contains("active")) s._t0 = performance.now(); s.classList.toggle("active", j === i); });
  document.getElementById("num").textContent = i < mainCount ? `${i + 1} / ${mainCount}` : `appendix ${i - mainCount}`; location.hash = i + 1;
  if (i === 0) { t0 = null; timerEl.textContent = ""; } else if (t0 === null) t0 = Date.now();
  pvwin.innerHTML = "";
  if (i + 1 < slides.length) {
    pvw.style.display = "";
    pvwin.style.transform = `scale(${pvwin.parentElement.clientWidth / innerWidth})`;
    const c = slides[i + 1].cloneNode(true); c.classList.add("active"); c.removeAttribute("id");
    pvwin.appendChild(c);
  } else pvw.style.display = "none";
};
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) i = Math.max(0, i - 1);
  show();
});
addEventListener("resize", () => show());
document.addEventListener("click", e => { i = e.clientX > innerWidth / 2 ? Math.min(slides.length - 1, i + 1) : Math.max(0, i - 1); show(); });
show();
</script>
</body>
